<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Understudy</title>
<style>
  :root{
    --bg:#0e0f12; --card:#16181d; --card2:#1c1f26; --line:#262a33;
    --tx:#e7e9ee; --dim:#8b93a3; --accent:#8b7bff; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
  header{position:sticky;top:0;background:rgba(14,15,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px;z-index:5}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .grow{flex:1}
  h1{font-size:17px;margin:0;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block}
  .dot.on{background:var(--ok)}
  .muted{color:var(--dim);font-size:12px}
  nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
  nav button{background:var(--card);color:var(--dim);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
  nav button.active{background:var(--accent);color:#fff;border-color:transparent}
  main{padding:14px;max-width:900px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:600}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
  .badge.dry{color:var(--warn);border-color:#4a3a1c}
  .badge.silent{color:var(--bad);border-color:#4a2222}
  .badge.awaiting{color:var(--accent);border-color:#33305c}
  .bars{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin:8px 0;font-size:11px}
  .mood-edit{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:4px}
  .mrow{display:grid;grid-template-columns:88px 1fr 42px;gap:8px;align-items:center;font-size:11px}
  .mkey{color:var(--dim)}
  .mval{text-align:right;font-variant-numeric:tabular-nums}
  input[type=range].mrange{padding:0;height:22px;background:transparent;border:0;accent-color:var(--accent)}
  .bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  button.act{background:var(--card2);color:var(--tx);border:1px solid var(--line);padding:7px 11px;border-radius:9px;font-size:12px}
  button.act.primary{background:var(--accent);border-color:transparent;color:#fff}
  button.act.danger{color:var(--bad)}
  input,select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;width:100%}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  pre{background:#0a0b0e;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;max-height:420px;overflow:auto;white-space:pre-wrap}
  .slots{display:flex;flex-wrap:wrap;gap:6px}
  .slot{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px}
  .slot.next{border-color:var(--accent);color:#fff}
  .slot.past{opacity:.4}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--accent);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="pname">Understudy</h1>
    <span class="badge" id="pstate">—</span>
    <span class="grow"></span>
    <span class="muted"><span class="dot" id="dot"></span> <span id="num">—</span></span>
  </div>
  <div class="muted" id="sub" style="margin-top:4px">memuat…</div>
  <nav id="tabs">
    <button data-t="contacts" class="active">Kontak</button>
    <button data-t="settings">Setting</button>
    <button data-t="schedule">Jadwal</button>
    <button data-t="quota">Kuota</button>
    <button data-t="log">Log</button>
  </nav>
</header>

<main>
  <section id="tab-contacts"></section>
  <section id="tab-settings" hidden></section>
  <section id="tab-schedule" hidden></section>
  <section id="tab-quota" hidden></section>
  <section id="tab-log" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, html) => { const d=document.createElement(tag); if(html!==undefined) d.innerHTML=html; return d; };
const esc = (s) => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA = null, SETTINGS_LOADED = false, tab = "contacts";

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)} : {});
  return r.json().catch(()=>({}));
}
function ago(ts){
  if(!ts) return "—";
  const m = Math.round((Date.now()-ts)/60000);
  if(m<1) return "baru saja";
  if(m<60) return m+" menit lalu";
  const h=Math.round(m/60); if(h<24) return h+" jam lalu";
  return Math.round(h/24)+" hari lalu";
}
const MOODKEYS=["valence","energy","arousal","affection","patience","playfulness"];
let moodDirty = false;

function renderHeader(){
  const b = DATA.bot;
  $("#pname").textContent = `${b.persona.emoji} ${b.persona.name}`;
  $("#dot").className = "dot" + (b.connected ? " on" : "");
  $("#num").textContent = b.number || "belum tersambung";
  const h=Math.floor(b.uptimeSec/3600), m=Math.floor(b.uptimeSec%3600/60);
  $("#sub").textContent = `aktif ${h}j ${m}m · online ${b.presences?"jam aktif":"nonaktif"} · chat duluan: sepi>${b.idleMin}m, jeda ${b.gapMin}m`;
}

function renderContacts(){
  const root = $("#tab-contacts"); root.innerHTML="";
  if(!DATA.contacts.length){ root.appendChild(el("div",'<div class="card">Belum ada kontak.</div>')); return; }
  for(const c of DATA.contacts){
    const card = el("div");
    card.className = "card";
    const badgeCls = c.state==="dry"?"dry":c.state==="silent"?"silent":c.state==="awaiting"?"awaiting":"";
    let bars = "";
    if(c.mood){
      bars = '<div class="bars">' + MOODKEYS.map(k=>{
        const v=c.mood[k], pct=Math.round((k==="valence"?(v+1)/2:v)*100);
        return `<span>${k}</span><span class="bar"><i style="width:${pct}%"></i></span>`;
      }).join("") + "</div>";
    }
    card.innerHTML = `
      <div class="row">
        <h2 style="margin:0">${esc(c.name||c.number)}</h2>
        <span class="badge">${esc(c.number)}</span>
        <span class="badge ${badgeCls}">${c.state}${c.state==="dry"?` (${c.dryCount})`:""}</span>
        ${c.softMinutes?`<span class="badge" style="border-color:#6b4a7a;color:#e3b6ff">soft ${c.softMinutes}m</span>`:""}
        <span class="grow"></span>
        <span class="muted">${c.inbound}/${c.outbound} · ${ago(c.lastInteraction)}</span>
      </div>
      ${bars}
      <div class="mood-edit" data-jid="${esc(c.jid)}">
        <div class="row"><b style="font-size:12px">Mood manual</b><span class="grow"></span><span class="muted mlabel">${esc(c.moodLabel||"")}</span></div>
        ${MOODKEYS.map(k=>{
          const v=c.mood?c.mood[k]:0.5;
          const min=k==="valence"?-1:0, max=1, step=0.05;
          return `<div class="mrow"><span class="mkey">${k}</span><input type="range" class="mrange" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${v}"><span class="mval">${Number(v).toFixed(2)}</span></div>`;
        }).join("")}
        <div class="row" style="margin-top:6px">
          <button class="act primary" data-act="mood-save" data-jid="${esc(c.jid)}">Simpan mood</button>
          <button class="act" data-act="mood-auto" data-jid="${esc(c.jid)}">Auto (model)</button>
          <button class="act" data-act="mood-neutral" data-jid="${esc(c.jid)}">Netral</button>
        </div>
      </div>
      ${(c.commitments&&c.commitments.length)?`<div class="muted" style="margin-top:6px">Janji: ${c.commitments.map(x=>`“${esc(x.what)}” (${new Date(x.due).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})})`).join(" · ")}</div>`:""}
      <div class="row" style="margin-top:8px">
        <div style="flex:1;min-width:120px"><label>Panggilan</label><input data-jid="${esc(c.jid)}" class="nick" value="${esc(c.nick)}" placeholder="mis. sayang"></div>
        <div style="flex:1;min-width:120px"><label>Karakter (slug, opsional)</label><input data-jid="${esc(c.jid)}" class="persona" value="${esc(c.persona)}" placeholder="(default)"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="act primary" data-act="proactive" data-jid="${esc(c.jid)}">Chat duluan sekarang</button>
        <button class="act" data-act="save" data-jid="${esc(c.jid)}">Simpan</button>
        <button class="act" data-act="reset" data-jid="${esc(c.jid)}">Reset konteks</button>
      </div>`;
    root.appendChild(card);
  }
  root.oninput = (e) => {
    if (!e.target.classList || !e.target.classList.contains("mrange")) return;
    moodDirty = true;
    const val = e.target.closest(".mrow")?.querySelector(".mval");
    if (val) val.textContent = Number(e.target.value).toFixed(2);
  };
  root.onclick = async (e) => {
    const b = e.target.closest("button"); if(!b) return;
    const jid = b.dataset.jid, act = b.dataset.act;
    if(act==="proactive"){ const r = await api("/api/proactive",{jid}); toast(r.ok?("terkirim: "+r.text):("gagal: "+r.reason)); refresh(); }
    if(act==="mood-neutral"){
      const mood={valence:0.15,energy:0.6,arousal:0.45,affection:0.5,patience:0.6,playfulness:0.5};
      const r=await api("/api/mood",{jid,mood}); toast("mood → "+(r.label||"neutral")); moodDirty=false; refresh(true);
    }
    if(act==="mood-save"){
      const card=b.closest(".card"); const mood={};
      card.querySelectorAll(".mrange").forEach(s=>{ mood[s.dataset.k]=Number(s.value); });
      const r=await api("/api/mood",{jid,mood}); toast("mood disimpan → "+(r.label||"")); moodDirty=false; refresh(true);
    }
    if(act==="mood-auto"){
      toast("model sedang menilai mood…");
      const r=await api("/api/mood/auto",{jid,apply:true});
      toast(r.ok?("auto mood → "+(r.label||"")+(r.suggested&&r.suggested.reason?" · "+r.suggested.reason:"")):("gagal: "+(r.error||"")));
      moodDirty=false; refresh(true);
    }
    if(act==="save"){
      const card = b.closest(".card");
      const nick = $(".nick",card).value, persona = $(".persona",card).value;
      await api("/api/contact",{jid,field:"nick",value:nick});
      await api("/api/contact",{jid,field:"persona",value:persona});
      toast("disimpan"); refresh();
    }
    if(act==="reset"){ await api("/api/contact/reset",{jid}); toast("konteks direset"); refresh(); }
  };
}

function renderSettings(){
  if(!SETTINGS_LOADED){
    const s = DATA.settings, root = $("#tab-settings");
    root.innerHTML = `
      <div class="card">
        <h2>Karakter</h2>
        <div class="grid">
          <div><label>Karakter aktif</label><select id="set-persona">${DATA.personas.map(p=>`<option value="${esc(p.slug)}" ${p.slug===DATA.bot.persona.slug?"selected":""}>${esc(p.emoji+" "+p.name)}</option>`).join("")}</select></div>
          <div><label>Jam aktif (active_hours)</label><input id="set-hours" value="${esc(s.activeHours)}" placeholder="11-14,17-19,21-2"></div>
          <div><label>Jadwal chat duluan (chat_schedule)</label><input id="set-sched" value="${esc(s.chatSchedule)}" placeholder="11,12,13,17,18,19,20,22,23,0"></div>
        </div>
        <div class="muted" style="margin-top:6px">Format jadwal: <b>jam saja</b> = menit dinamis tiap hari (11,12,13) · <b>jam:menit</b> = menit tetap (12:30).</div>
      </div>
      <div class="card">
        <h2>Tingkah laku</h2>
        <div class="grid">
          ${s.knobs.map(k=>`<div><label>${esc(k.label)}</label><input data-k="${esc(k.key)}" class="knob" value="${esc(k.value)}" ${k.kind==="text"?'':"inputmode=decimal"}></div>`).join("")}
        </div>
        <div class="row" style="margin-top:12px">
          <button class="act primary" id="btn-save-settings">Simpan setting</button>
          <button class="act primary" id="btn-save-restart">Simpan &amp; Restart</button>
          <button class="act" id="btn-auto">Auto (model yang atur)</button>
          <button class="act danger" id="btn-restart">Restart bot</button>
        </div>
        <div class="muted" id="save-hint" style="margin-top:8px"></div>
      </div>`;
    $("#btn-save-settings").onclick = () => saveSettings(false);
    $("#btn-save-restart").onclick = () => saveSettings(true);
    $("#btn-auto").onclick = async () => {
      toast("model sedang memilih…");
      const r = await api("/api/auto",{apply:true});
      if(r.ok){ toast("setting otomatis diterapkan"); SETTINGS_LOADED=false; refresh(true); }
      else toast("gagal");
    };
    $("#btn-restart").onclick = async () => { await api("/api/restart",{}); toast("restart…"); };
    SETTINGS_LOADED = true;
  }
}

async function saveSettings(andRestart){
  const values = {};
  document.querySelectorAll(".knob").forEach(i=>{
    const v=i.value.trim();
    values[i.dataset.k] = isNaN(Number(v)) || v==="" ? v : Number(v);
  });
  const activeHours = $("#set-hours").value.trim();
  const chatSchedule = $("#set-sched").value.trim();
  const slug = $("#set-persona").value;
  if(slug !== DATA.bot.persona.slug) await api("/api/persona",{slug});
  await api("/api/settings",{values, activeHours, chatSchedule});
  // re-render from the file so we can see what was actually persisted
  SETTINGS_LOADED = false;
  toast(andRestart ? "disimpan, merestart…" : "tersimpan");
  await refresh(true);
  const hint = $("#save-hint");
  if(hint) hint.innerHTML = andRestart
    ? "✓ tersimpan &amp; direstart — tunggu ~10 detik."
    : "✓ tersimpan ke .env. <b>Klik “Simpan &amp; Restart”</b> (atau Restart bot) biar bot yang jalan baca nilai barunya.";
  if(andRestart) await api("/api/restart",{});
}

function renderSchedule(){
  const root = $("#tab-schedule"); root.innerHTML="";
  const next = DATA.schedule.find(s=>!s.passed && !s.quiet);
  const card = el("div"); card.className="card";
  card.innerHTML = `<h2>Jadwal hari ini</h2>
    <div class="slots">${DATA.schedule.map(s=>`<span class="slot ${s.passed?"past":""} ${next&&s.time===next.time?"next":""}">${s.time}${s.quiet?" (tenang)":""}</span>`).join("") || '<span class="muted">(belum diatur)</span>'}</div>
    <div class="muted" style="margin-top:10px">
      Berikutnya: <b>${next?next.time:"—"}</b> · sepi minimal ${DATA.bot.idleMin} menit · jeda antar chat duluan ${DATA.bot.gapMin} menit · jam tenang ${DATA.bot.quiet[0]}:00–${DATA.bot.quiet[1]}:00
    </div>`;
  root.appendChild(card);
}

function renderQuota(){
  const root=$("#tab-quota"); root.innerHTML="";
  const q=DATA.quota;
  const rows = Object.entries(q.usage||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.calls}</td><td>${v.in}</td><td>${v.out}</td></tr>`).join("");
  const c=el("div"); c.className="card";
  c.innerHTML = `<h2>Pemakaian hari ini ${q.usageDay?`(${q.usageDay})`:""}</h2>
    <table><tr><th>provider</th><th>call</th><th>token in</th><th>token out</th></tr>${rows||'<tr><td colspan=4 class="muted">belum ada</td></tr>'}</table>
    <div class="muted" style="margin-top:10px">
      Foto: <b>${q.photos}/${q.photoMax}</b> · TTS: <b>${q.ttsChars}${q.ttsMax?`/${q.ttsMax}`:""}</b> karakter
      ${q.eleven?`· ElevenLabs sisa <b>${q.eleven.left}</b> karakter (reset ${q.eleven.reset})`:""}
    </div>`;
  root.appendChild(c);
}

function renderLog(){
  const root=$("#tab-log");
  root.innerHTML = `<div class="card"><h2>Log (60 baris terakhir)</h2><pre>${esc((DATA.log||[]).join("\n"))}</pre></div>`;
}

function renderAll(){
  renderHeader();
  if(tab==="contacts" && !moodDirty) renderContacts();
  if(tab==="settings") renderSettings();
  if(tab==="schedule") renderSchedule();
  if(tab==="quota") renderQuota();
  if(tab==="log") renderLog();
}

async function refresh(forceSettings){
  DATA = await api("/api/summary");
  if(forceSettings) SETTINGS_LOADED = false;
  renderAll();
}

document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    tab = b.dataset.t;
    document.querySelectorAll("main > section").forEach(s=>s.hidden=true);
    $("#tab-"+tab).hidden=false;
    renderAll();
  };
});

refresh();
setInterval(()=>{ if(tab!=="settings") refresh(); }, 5000);
</script>
</body>
</html>
