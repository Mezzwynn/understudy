<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#131109" />
<link rel="icon" href="/logo.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Understudy" />
<title id="doctitle">Understudy — Control Panel</title>
<style>
  /* ─────────────────────────────  design tokens  ───────────────────────────── */
  :root{
    /* one fixed palette: soft dark, warm orange & yellow */
    --bg:#131109;
    --bg-2:#1b1710;
    --panel:rgba(40,33,22,.74);
    --panel-2:rgba(52,43,29,.62);
    --card-2:rgba(30,25,17,.74);
    --line:rgba(255,206,150,.13);
    --line-2:rgba(255,206,150,.21);
    --tx:#faf1e2;
    --dim:#c6ae92;
    --dim-2:#a08b73;
    --accent:#ffb257;
    --accent-2:#e08a2a;
    --accent-glow:rgba(255,178,87,.35);
    --on-accent:#1d1408;
    --ok:#b8dd8a;
    --warn:#ffd166;
    --bad:#ff8f7a;
    --soft:#ffcf9e;
    --r-lg:20px; --r:14px; --r-sm:10px;
    --shadow:0 18px 50px -22px rgba(0,0,0,.92);
    --blur:blur(18px) saturate(135%);
    --pad:16px; --gap:18px; --fs:15px;
    --glow-1:rgba(255,152,58,.17); --glow-2:rgba(255,206,92,.08);
    --header-bg:rgba(19,17,9,.9); --header-bg2:rgba(19,17,9,.66);
    --input-bg:rgba(14,12,7,.72);
    --ghost:rgba(255,206,150,.06); --track:rgba(255,206,150,.13);
    --conv:rgba(10,9,5,.5); --bub-them:rgba(255,206,150,.07); --code-bg:rgba(9,8,4,.78);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-size:var(--fs);
    background:
      radial-gradient(1100px 600px at 50% -260px, var(--glow-1), transparent 62%),
      radial-gradient(700px 420px at 100% 10%, var(--glow-2), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg-2) 40%,var(--bg));
    background-attachment:fixed;
    color:var(--tx);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6;
    padding-bottom:64px;
    min-height:100vh;
  }
  a{color:var(--accent)}
  ::selection{background:var(--accent-glow)}
  /* thin scrollbars */
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}

  /* ─────────────────────────────  header  ───────────────────────────── */
  header{position:sticky;top:0;z-index:40;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    background:linear-gradient(180deg,var(--header-bg),var(--header-bg2));border-bottom:1px solid var(--line)}
  .hwrap{max-width:1080px;margin:0 auto;padding:14px 16px 0}
  .brandrow{display:flex;align-items:center;gap:12px}
  .logobox{position:relative;flex:none;width:52px;height:52px;border-radius:17px;overflow:hidden;display:block;
    box-shadow:0 12px 28px -16px rgba(0,0,0,.75)}
  .logobox img{width:100%;height:100%;object-fit:cover;display:block}
  .namerow{display:flex;align-items:center;gap:8px;min-width:0}
  .ver{font-size:10.5px;font-weight:600;letter-spacing:.4px;color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);
    padding:2px 7px;border-radius:999px;flex:none}
  .brandtxt{min-width:0}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .subline{display:flex;align-items:center;gap:7px;margin-top:2px;flex-wrap:wrap}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--bad);position:relative;flex:none}
  .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;opacity:0}
  .pulse.on{background:var(--ok);color:var(--ok);animation:breathe 2.8s ease-in-out infinite}
  .pulse.on::after{animation:ring 2.8s ease-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}50%{box-shadow:0 0 14px 2px rgba(61,220,151,.25)}}
  @keyframes ring{0%{opacity:.55;transform:scale(.7)}70%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
  .chip{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);
    background:var(--panel-2);color:var(--dim);white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
  .chip b{color:var(--tx);font-weight:600}
  .chip.ok{color:#8ff0bb;border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
  .chip.warn{color:#f2cf9b;border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.08)}
  .chip.soft{color:var(--soft);border-color:rgba(227,182,255,.35);background:rgba(227,182,255,.08)}
  .chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

  body.t-mono .bub.her{color:var(--tx)}

  @media (max-width:430px){
    #chip-up{display:none}
    .subline{flex-wrap:wrap;row-gap:6px}
    #chip-now{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #chip-now b{display:none}
    #chip-next{display:none}
    .namerow h1{font-size:17.5px}
    .logobox{width:44px;height:44px;border-radius:14px}
  }

  .feat{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .feat:last-child{border-bottom:0}
  .switch{width:48px;height:28px;border-radius:999px;border:1px solid var(--line-2);background:var(--track);
    position:relative;cursor:pointer;flex:none;transition:.2s;padding:0}
  .switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:var(--dim);transition:.2s cubic-bezier(.2,.8,.2,1)}
  .switch.on{background:color-mix(in srgb,var(--accent) 38%,transparent);border-color:var(--accent)}
  .switch.on span{left:25px;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
  .switch:active span{width:24px}

  .chatwrap{max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:var(--conv)}
  .chatrow{display:flex}
  .chatrow.her{justify-content:flex-start}
  .chatrow.them{justify-content:flex-end}
  .chatday{align-self:center;font-size:10.5px;color:var(--dim-2);background:var(--ghost);border:1px solid var(--line);
    padding:3px 10px;border-radius:999px;margin:10px 0 4px}
  .chatrow .bub{margin:0;max-width:82%}

  /* tabs */
  nav{display:flex;gap:3px;margin:12px 0 0;overflow-x:auto;padding-bottom:11px;scrollbar-width:none;position:relative;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
  nav::-webkit-scrollbar{display:none}
  nav button{position:relative;background:transparent;color:var(--dim);border:1px solid transparent;
    padding:8px 11px;border-radius:11px;font-size:12.5px;font-family:inherit;white-space:nowrap;cursor:pointer;transition:.18s;flex:none}
  nav button:hover{color:var(--tx);background:var(--ghost)}
  nav button.active{color:var(--tx);background:color-mix(in srgb, var(--accent) 22%, transparent);
    border-color:color-mix(in srgb, var(--accent) 45%, transparent);box-shadow:0 8px 26px -14px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.12)}
  nav button .dot{position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--warn)}

  /* ─────────────────────────────  layout  ───────────────────────────── */
  main{padding:16px;max-width:1080px;margin:0 auto}
  section{animation:fade .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{position:relative;background:linear-gradient(180deg,var(--panel),var(--card-2));
    border:1px solid var(--line-2);border-radius:var(--r-lg);padding:var(--pad);margin-bottom:var(--gap);
    box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,var(--accent),transparent);opacity:.55}
  .card[data-tone="bad"]::before{background:linear-gradient(180deg,var(--bad),transparent)}
  .card[data-tone="warn"]::before{background:linear-gradient(180deg,var(--warn),transparent)}
  .card[data-tone="soft"]::before{background:linear-gradient(180deg,var(--soft),transparent)}
  .card.tight::before{top:10px;bottom:10px}
  .card.tight{padding:12px 14px}
  @media (max-width:520px){ .card{padding:14px;border-radius:17px} .card.hero{padding:15px} }
  .card.hero{padding:calc(var(--pad) + 2px)}
  h2{font-size:11.5px;margin:0 0 12px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .muted{color:var(--dim);font-size:12px}
  .tiny{font-size:11.5px;color:var(--dim-2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
  .stat{font-size:12px;color:var(--dim)}
  .stat b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 0}
  .kick{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:650}

  /* ─────────────────────────────  controls  ───────────────────────────── */
  button.act{background:var(--panel-2);color:var(--tx);border:1px solid var(--line-2);padding:10px 14px;min-height:40px;
    border-radius:11px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.16s}
  button.act:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);transform:translateY(-1px)}
  button.act:active{transform:translateY(0) scale(.985)}
  button.act.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);font-weight:600;
    box-shadow:0 10px 26px -14px var(--accent-glow)}
  button.act.primary:hover{filter:brightness(1.08)}
  button.act.ghost{background:transparent}
  button.act.danger{color:var(--bad);border-color:rgba(255,107,125,.35)}
  button.act[disabled]{opacity:.4;pointer-events:none}
  /* ── tab Photos: baju ── */
  .wadd{display:flex;flex-direction:column;gap:8px}
  .wadd input{width:100%}
  .whead{display:flex;flex-direction:column;gap:10px}
  .wphoto{display:flex;gap:12px;align-items:center}
  .wthumb{width:76px;height:100px;object-fit:cover;border-radius:10px;flex:0 0 auto}
  .wno{background:#0d0b06;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:10.5px;text-align:center}
  .wname,.wdesc{width:100%;min-width:0;box-sizing:border-box}
  .wname{font-size:13.5px}
  .wdesc{font-size:12px;color:var(--dim)}
  .wact{display:flex;gap:8px;flex-wrap:wrap}
  .wact .act{flex:1;min-width:92px}
  .wcat{display:flex;flex-direction:column;gap:9px;margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
  .wcatrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
  .wcatrow .lbl{font-size:11px;color:var(--dim);width:40px}
  .wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
  .swline{display:flex;align-items:center;gap:6px;min-width:0}
  .swline em{font-style:normal;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cg{display:flex;flex-direction:column;gap:6px}
  .ci{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px}
  .ci .tiny{margin-left:auto;color:var(--dim)}
  .histgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
  .hist{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .hist img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
  .hist .noimg{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--dim)}
  .hist .body{padding:8px 10px}
  .hb{font-size:11px;padding:6px 7px;flex:1}
  .hb.sel{background:#241e14;border-color:var(--accent);color:var(--accent)}
  @media(max-width:520px){ .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  /* ── baris setelan: label di kiri, kontrol di kanan, tidak bisa nabrak ── */
  .rows{display:flex;flex-direction:column;gap:11px}
  .mrow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-width:0}
  .mrow2>span:first-child{font-size:13px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
  .mrow2 .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  .swline{display:inline-flex;align-items:center;gap:7px;min-width:0;justify-content:flex-end}
  .swline em{font-style:normal;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .nin{width:78px;text-align:right;background:#241e14;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:8px 10px;font-size:13px;box-sizing:border-box}
  .sin{background:#241e14;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:8px 10px;font-size:13px;min-width:0;max-width:100%;box-sizing:border-box}
  @media(max-width:430px){
    .mrow2{grid-template-columns:1fr;gap:7px}
    .mrow2 .row{justify-content:flex-start}
    .swline{justify-content:flex-start}
    .nin{width:100%;text-align:left}
  }
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  input,select,textarea{background:var(--input-bg);color:var(--tx);border:1px solid var(--line-2);
    border-radius:11px;padding:10px 12px;font-size:13px;font-family:inherit;width:100%;transition:.16s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
  label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.2px}
  .hint{font-size:11.5px;color:var(--dim-2);margin-top:5px;line-height:1.55}
  details{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
  details summary{cursor:pointer;font-size:12.5px;color:var(--dim);list-style:none;display:flex;align-items:center;gap:8px;transition:.16s}
  details summary:hover{color:var(--tx)}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"›";font-size:17px;line-height:1;transition:.2s;display:inline-block;color:var(--dim-2)}
  details[open] summary::before{transform:rotate(90deg);color:var(--accent)}

  /* ─────────────────────────────  person card  ───────────────────────────── */
  .person{display:flex;gap:13px;align-items:flex-start}
  .pavatar{width:54px;height:54px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:20px;font-weight:700;
    background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--on-accent);
    box-shadow:0 14px 34px -16px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.2)}
  .pname{font-size:17px;font-weight:660;letter-spacing:-.3px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .visuals{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-top:14px}
  .radar{filter:drop-shadow(0 8px 26px rgba(0,0,0,.5))}
  .spark{width:100%;height:84px;display:block;margin-top:6px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .legend span{font-size:11.5px;color:var(--dim-2);display:inline-flex;align-items:center;gap:5px}
  .swatch{width:9px;height:9px;border-radius:3px;display:inline-block}
  .moodline{display:flex;align-items:center;gap:9px;margin-top:13px}
  .moodname{font-size:15px;font-weight:640}
  .mbars{display:flex;flex-direction:column;gap:5px;margin-top:11px}
  .mrow{display:grid;grid-template-columns:78px 1fr 44px;gap:9px;align-items:center;font-size:12px}
  .mkey{color:var(--dim)}
  .mval{text-align:right;font-variant-numeric:tabular-nums}
  .track{height:7px;border-radius:5px;background:var(--track);overflow:hidden;position:relative}
  .track i{position:absolute;inset:0 auto 0 0;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;height:26px;width:100%}
  input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:5px;background:var(--track)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-8px;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));border:3px solid #12100a;box-shadow:0 0 0 1px var(--accent),0 6px 16px -6px var(--accent-glow)}

  /* conversation preview */
  .conv{background:var(--conv);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:13px}
  .bub{max-width:88%;padding:9px 13px;border-radius:15px;font-size:13px;line-height:1.45;margin-bottom:7px;white-space:pre-wrap;word-break:break-word}
  .bub.them{background:var(--bub-them);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bub.her{background:color-mix(in srgb, var(--accent) 22%, transparent);border:1px solid color-mix(in srgb, var(--accent) 38%, transparent);
    margin-left:auto;border-bottom-right-radius:5px}

  /* ─────────────────────────────  timeline (schedule)  ───────────────────────────── */
  .timeline{position:relative;height:66px;margin-top:6px}
  .tl-track{position:absolute;inset:22px 0 auto;height:22px;border-radius:8px;background:var(--ghost);overflow:hidden;border:1px solid var(--line)}
  .tl-zone{position:absolute;top:0;bottom:0;opacity:.5}
  .tl-slot{position:absolute;top:14px;width:3px;height:38px;border-radius:3px;background:linear-gradient(180deg,var(--accent),transparent)}
  .tl-now{position:absolute;top:8px;width:2px;height:50px;background:var(--ok);box-shadow:0 0 12px 2px rgba(61,220,151,.6)}
  .tl-lbl{position:absolute;top:0;font-size:9.5px;color:var(--dim-2);transform:translateX(-50%)}
  .tl-ticks{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;font-size:9px;color:var(--dim-2)}

  /* ─────────────────────────────  rings (usage)  ───────────────────────────── */
  .rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;justify-items:center}
  .ring{text-align:center}
  .ring .cap{font-size:11px;color:var(--dim);margin-top:6px}
  .ring .big{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}

  /* ─────────────────────────────  table / log / toast  ───────────────────────────── */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:550;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
  tr:last-child td{border-bottom:0}
  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);padding:13px;font-size:11px;
    max-height:58vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}
  .slots{display:flex;flex-wrap:wrap;gap:6px}
  .slot{background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:6px 11px;font-size:12px}
  .slot.next{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--tx);font-weight:600}
  .slot.past{opacity:.32}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:linear-gradient(180deg,var(--accent),var(--accent-2));
    color:var(--on-accent);padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.26s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;z-index:60;max-width:90vw;text-align:center;box-shadow:0 18px 40px -18px rgba(0,0,0,.9)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .castcard{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--ghost)}
  .castav{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;
    background:var(--ghost);border:1px solid var(--line-2)}
  .typing span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brandrow">
      <a class="logobox" href="/" title="Understudy">
        <img src="/logo.png" alt="Understudy" />
      </a>
      <div class="brandtxt grow">
        <div class="namerow">
          <h1 id="pname">Understudy</h1>
          <span class="ver" id="chip-ver">v—</span>
        </div>
        <div class="subline">
          <span class="pulse" id="dot"></span>
          <span class="tiny" id="num">—</span>
          <span class="chip" id="pstate">—</span>

      <button data-t="character">Character</button>

</header>

<main>
  <section id="tab-contacts">
    <div class="card tight" id="ctools">
      <input id="q" placeholder="Search contacts…" autocomplete="off">
      <div class="tiny" id="contacts-hint" style="margin-top:6px">auto-refresh pauses while you edit</div>
    </div>
    <div id="clist"></div>
  </section>
  <section id="tab-chat" hidden></section>
  <section id="tab-status" hidden></section>
  <section id="tab-photos" hidden></section>
  <section id="tab-character" hidden></section>
  <section id="tab-agent" hidden></section>
  <section id="tab-schedule" hidden></section>
  <section id="tab-settings" hidden></section>
  <section id="tab-quota" hidden></section>
  <section id="tab-log" hidden></section>
</main>
<div class="toast" id="toast"></div>
<div id="errbanner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:#3a1d12;border-top:1px solid #7a3a22;color:#ffd7bd;padding:10px 14px;font-size:12px">
  <b>Dashboard error</b> <span id="errmsg"></span>
  <button class="act" style="margin-left:8px;padding:4px 10px" onclick="location.reload()">Reload</button>
</div>

<script>
// Kalau ada error JS, tampilkan di layar: error sebelumnya bikin tombol & switch diam tanpa jejak
window.addEventListener("error", (e) => {
  try {
    let b = document.getElementById("understudyErrorBar");
    if (!b) {
      b = document.createElement("div");
      b.id = "understudyErrorBar";
      b.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#4d1a1a;color:#ffc9c9;font:12px/1.45 monospace;padding:8px 10px;white-space:pre-wrap;max-height:30vh;overflow:auto;pointer-events:auto";
      b.onclick = () => b.remove();   // bisa ditutup, dan tidak menutupi tombol di bawahnya
      document.body.appendChild(b);
    }
    b.textContent = "PANEL ERROR: " + (e.message || e.type) + " @ " + String(e.filename || "").split("/").pop() + ":" + (e.lineno || "?");
  } catch {}
});

// no service worker: it only ever hid updates
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});

const BUILD_STAMP = "tanya-server"; // nilai aslinya dari /build-stamp.js (mtime file = selalu baru kalau ada perubahan)
if (!window.__autoReloaded) {
  fetch("/build-stamp.js", { cache: "reload" })
    .then((r) => r.text())
    .then((t) => {
      const m = /__SERVER_BUILD__ = "([^"]+)"/.exec(t);
      if (m && window.__SERVER_BUILD__ && m[1] !== window.__SERVER_BUILD__) {
        window.__autoReloaded = true;
        location.reload();
      }
    })
    .catch(() => {});
}

/* ═══════════════════════════════ helpers ═══════════════════════════════ */
// surface any runtime error instead of leaving a half-dead page behind
function showError(msg){
  const b = document.getElementById("errbanner");
  const m = document.getElementById("errmsg");
  if(b && m){ m.textContent = String(msg).slice(0, 180); b.style.display = "block"; }
}
window.addEventListener("error", (e)=>showError(e.message));
window.addEventListener("unhandledrejection", (e)=>showError((e.reason && e.reason.message) || e.reason));

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MOODKEYS = ["valence","energy","arousal","affection","patience","playfulness"];
const MOODCOLOR = { valence:"#cfe08a", energy:"#ffc773", arousal:"#ff9a6b", affection:"#ffb0c4", patience:"#a8dcd0", playfulness:"#ffe08a" };
let PHOTO_PICK={outfit:"",style:"casual"};
let DATA=null, tab="contacts", SETTINGS_LOADED=false, CHAR_SLUG=null, charDirty=false;
let contactsDirty=false, dragging=false, AGENT_LOG=[], AGENT_LOADED=false;
const draft={}, openCards=new Set();

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)} : {});
  return r.json().catch(()=>({}));
}
function ago(ts){
  if(!ts) return "—";
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1) return "just now";
  if(m<60) return m+"m ago";
  const h=Math.round(m/60); if(h<24) return h+"h ago";
  return Math.round(h/24)+"d ago";
}
const pctOf = (k,v) => Math.max(0,Math.min(100, Math.round((k==="valence"?(v+1)/2:v)*100)));
function moodColor(k,v){
  if(k==="valence") return v<0 ? "linear-gradient(90deg,#7a4436,#ff8f7a)" : "linear-gradient(90deg,#6a6a2f,#cfe08a)";
  return `linear-gradient(90deg,${MOODCOLOR[k]}55,${MOODCOLOR[k]})`;
}
const fmtMs = (v) => { const n=Number(v); return Number.isFinite(n) ? (n/1000).toFixed(n<1000?2:1)+"s" : ""; };
function hintFor(k,v){
  const n=Number(v);
  if(!Number.isFinite(n)) return k==="DEFAULT_NICK" ? "empty = she uses “you”" : "";
  if(/_MS$/.test(k)) return "≈ "+fmtMs(n);
  if(/_CHANCE$/.test(k) || /^NICK_MOOD_MIN$/.test(k)) return Math.round(n*100)+"%";
  if(/_MIN$/.test(k) || /_AFTER$/.test(k)) return n+" min";
  return "";
}

/* ═══════════════════════════════ svg visuals ═══════════════════════════════ */
function radarSVG(mood, size=118){
  const cx=size/2, cy=size/2, R=size/2-19, N=MOODKEYS.length;
  const pt=(i,r)=>{ const a=(-Math.PI/2)+(i*2*Math.PI/N); return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  let rings="";
  for(const f of [.25,.5,.75,1]){
    const p=MOODKEYS.map((_,i)=>pt(i,R*f).join(",")).join(" ");
    rings+=`<polygon points="${p}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
  }
  let spokes="";
  MOODKEYS.forEach((k,i)=>{
    const [x,y]=pt(i,R);
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.06)"/>`;
  });
  const vals=MOODKEYS.map((k,i)=>{ const v=mood?mood[k]:0; const n=k==="valence"?(v+1)/2:v; return pt(i,Math.max(.06,n)*R).join(","); }).join(" ");
  return `<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="mood radar">
    <defs><radialGradient id="mg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffb257" stop-opacity=".5"/><stop offset="100%" stop-color="#ff9a3c" stop-opacity=".12"/>
    </radialGradient></defs>
    ${rings}${spokes}
    <polygon points="${vals}" fill="url(#mg)" stroke="#ffb257" stroke-width="1.6"/>
    ${MOODKEYS.map((k,i)=>{ const v=mood?mood[k]:0; const n=k==="valence"?(v+1)/2:v; const [x,y]=pt(i,Math.max(.06,n)*R);
      return `<circle cx="${x}" cy="${y}" r="2.6" fill="${MOODCOLOR[k]}"/>`; }).join("")}
  </svg>`;
}
function sparkSVG(hist, key="v", color="#ffb257", fallback=null){
  let pts=(hist||[]).filter(h=>Number.isFinite(h[key]));
  // no history yet: draw a flat line from the current value so the panel is not empty
  if(pts.length<2 && fallback!==null && Number.isFinite(fallback)){
    const now=Date.now();
    pts=[{t:now-3600000,[key]:fallback},{t:now,[key]:fallback}];
  }
  if(pts.length<2) return `<svg class="spark" viewBox="0 0 300 76"><text x="150" y="42" font-size="11" fill="#8b93a8" text-anchor="middle">no history yet — it builds as she chats</text></svg>`;
  const norm = key==="v" ? (x=>(x+1)/2) : (x=>x);
  const W=300,H=76,pad=6;
  const xs=(i)=>pad+(i*(W-pad*2))/(pts.length-1);
  const ys=(x)=>H-pad-(norm(x)*(H-pad*2));
  const path=pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(p[key]).toFixed(1)}`).join(" ");
  const area=`${path} L${xs(pts.length-1).toFixed(1)},${H-pad} L${pad},${H-pad} Z`;
  const id="sg"+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".42"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${xs(pts.length-1)}" cy="${ys(pts[pts.length-1][key])}" r="3" fill="${color}"/>
  </svg>`;
}
function ringSVG(value, max, label, cap, color="#ffb257"){
  const size=92, r=36, c=2*Math.PI*r, f=max>0?Math.max(0,Math.min(1,value/max)):0;
  return `<div class="ring">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="8"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"
        style="filter:drop-shadow(0 0 8px ${color}66)"/>
      <text x="${size/2}" y="${size/2-1}" text-anchor="middle" font-size="16" font-weight="650" fill="#eceef5">${label}</text>
      <text x="${size/2}" y="${size/2+14}" text-anchor="middle" font-size="9" fill="#5b6376">${max>0?Math.round(f*100)+"%":"—"}</text>
    </svg>
    <div class="cap">${esc(cap)}</div>
  </div>`;
}
function dayTimeline(info){
  const sleep=[DATA.bot.quiet[0], DATA.bot.quiet[1]];
  const inRange=(h,a,b)=> a<=b ? (h>=a&&h<b) : (h>=a||h<b);
  const zones=[...Array(24).keys()].map(h=>{
    const sleeping=inRange(h,sleep[0],sleep[1]);
    let active=false;
    for(const part of String(info.activeHours||"").split(",")){
      const m=part.trim().match(/^(\d{1,2})-(\d{1,2})$/); if(!m) continue;
      if(inRange(h, Number(m[1]), Number(m[2]))) active=true;
    }
    if(sleeping) return null;
    return {h, color: active ? "rgba(255,178,87,.5)" : "rgba(255,255,255,.045)"};
  }).filter(Boolean);
  const pos=(h,m=0)=>((h*60+m)/1440)*100;
  const slots=(info.slots||[]).map(s=>`<div class="tl-slot" style="left:${pos(s.hour, s.minute||0)}%"></div>`).join("");
  const now=new Date(), nowPct=pos(now.getHours(), now.getMinutes());
  return `<div class="timeline">
    <div class="tl-lbl" style="left:${nowPct}%">now</div>
    ${zones.map(z=>`<div class="tl-zone" style="left:${z.h*4.1666}%;width:4.1666%;background:${z.color}"></div>`).join("")}
    <div class="tl-track">${zones.map(z=>`<div class="tl-zone" style="left:${(z.h/24)*100}%;width:${(1/24)*100}%;background:${z.color}"></div>`).join("")}</div>
    ${slots}
    <div class="tl-now" style="left:${nowPct}%"></div>
    <div class="tl-ticks">${[0,6,12,18,24].map(h=>`<span>${String(h%24).padStart(2,"0")}</span>`).join("")}</div>
  </div>`;
}

/* ═══════════════════════════════ header ═══════════════════════════════ */
function renderHeader(){
  const b=DATA.bot;
  $("#pname").textContent = "Understudy";
  document.title = "Understudy — Control Panel";
  // what she is doing right now, from her own routine
  try {
    const now = new Date();
    const mins = now.getHours()*60 + now.getMinutes();
    const blocks = (DATA.routine && DATA.routine.blocks) || [];
    const cur = blocks.find(x => {
      const t = (v) => { const [h,m] = String(v||"").split(":").map(Number); return h*60 + (m||0); };
      return mins >= t(x.start) && mins < t(x.end);
    }) || (DATA.routine && DATA.routine.now) || null;
    const el = $("#chip-now");
    if (el && cur) { el.innerHTML = `${esc(cur.what)} <b>${cur.start}–${cur.end}</b>`; el.style.display=""; }
    else if (el) { el.style.display="none"; }
  } catch (e) { /* the chip is a nicety */ }
  const stamp = window.__SERVER_BUILD__ || BUILD_STAMP;
  $("#chip-ver").textContent = "v" + (DATA.version || "0.0.0") + " · " + (stamp === "tanya-server" ? "…" : String(stamp).slice(-8));
  $("#chip-ver").title = "build " + String(stamp);
  $("#chip-ver").title = BUILD_STAMP;
  $("#dot").className = "pulse" + (b.connected ? " on" : "");
  $("#num").textContent = b.number ? "+"+b.number : "not connected";
  $("#pstate").textContent = b.connected ? "online" : "disconnected";
  $("#pstate").className = "chip " + (b.connected ? "ok" : "warn");
  const h=Math.floor(b.uptimeSec/3600), m=Math.floor(b.uptimeSec%3600/60);
  $("#chip-up").innerHTML = `uptime <b>${h}h ${m}m</b>`;
  const next=(DATA.schedule||[]).find(s=>!s.passed && !s.quiet);
  $("#chip-next").innerHTML = next ? `next message <b>${next.time}</b>` : `quiet hours <b>${b.quiet[0]}:00–${b.quiet[1]}:00</b>`;
}

/* ═══════════════════════════════ contacts ═══════════════════════════════ */
function moodRead(c){
  return `<div class="mbars">${MOODKEYS.map(k=>{
    const v=c.mood?c.mood[k]:0;
    return `<div class="mrow"><span class="mkey">${k}</span>
      <span class="track"><i style="width:${pctOf(k,v)}%;background:${moodColor(k,v)}"></i></span>
      <span class="mval">${Number(v).toFixed(2)}</span></div>`;
  }).join("")}</div>`;
}
function moodEdit(c){
  const d=draft[c.jid]; const vals=d?d.values:c.mood;
  return `<div class="locked chip soft" style="display:flex;margin-bottom:9px">🔒 locked${c.moodLockedAt?` ${ago(c.moodLockedAt)}`:""} — changes on <b>Auto</b> only</div>
  <div class="mbars">${MOODKEYS.map(k=>{
    const v=vals?vals[k]:0.5, min=k==="valence"?-1:0;
    return `<div class="mrow"><span class="mkey">${k}</span>
      <input type="range" class="mrange" data-k="${k}" data-jid="${esc(c.jid)}" min="${min}" max="1" step="0.05" value="${v}">
      <span class="mval" data-v="${k}">${Number(v).toFixed(2)}</span></div>`;
  }).join("")}</div>
  <div class="btns">
    <button class="act primary" data-act="mood-save" data-jid="${esc(c.jid)}">Save &amp; lock</button>
    <button class="act" data-act="mood-baseline" data-jid="${esc(c.jid)}">Reset values</button>
    <button class="act" data-act="mood-auto" data-jid="${esc(c.jid)}">Auto (model)</button>
  </div>`;
}
function personCard(c){
  const initial=(c.name||c.number||"?").trim().charAt(0).toUpperCase();
  const rel=(DATA.relations||[]).find(r=>r.id===c.relation);
  const manual=c.moodMode==="manual";
  const stateBadge = c.state!=="idle" ? `<span class="chip ${c.state==="dry"?"warn":c.state==="silent"?"":"warn"}">${esc(c.state)}${c.state==="dry"?` ${c.dryCount}`:""}</span>` : "";
  const conv=(c.recent||[]).slice(-3).map(m=>`<div class="bub ${m.role==="user"?"them":"her"}">${esc(m.text)}</div>`).join("");
  return `<div class="card hero fadein" data-jid="${esc(c.jid)}" data-tone="${c.blocked?"bad":c.state==="dry"||c.state==="silent"?"warn":c.softMinutes?"soft":""}">
    <div class="person">
      <div class="pavatar">${esc(initial)}</div>
      <div class="grow">
        <div class="row" style="gap:7px">
          <h3 class="pname">${esc(c.name||c.number)}</h3>
          <span class="chip ${c.blocked?"":"ok"}">${c.blocked?"blocked":"trusted"}</span>
          ${stateBadge}
          ${c.softMinutes?`<span class="chip soft">soft ${c.softMinutes}m</span>`:""}
        </div>
        <div class="tiny" style="margin-top:3px">${esc(String(c.number||"").startsWith("+")?c.number:"+"+c.number)}${c.nick?` · called “${esc(c.nick)}”`:""}${rel?` · ${esc(rel.label)}`:""}</div>
        <div class="stat" style="margin-top:7px">in <b>${c.inbound}</b> · out <b>${c.outbound}</b> · last <b>${ago(c.lastInteraction)}</b></div>
        <div class="btns" style="margin-top:9px">
          <button class="act" data-act="proactive" data-jid="${esc(c.jid)}">Message now</button>
          <button class="act" data-act="mood-manual" data-jid="${esc(c.jid)}" ${manual?"disabled":""}>Take control of mood</button>
        </div>
      </div>
    </div>

    <div class="visuals">
      ${radarSVG(c.mood)}
      <div style="width:100%">
        ${manual ? `<div class="muted" style="font-size:12.5px">You are holding these values by hand. Use the sliders below, then <b>Save &amp; lock</b>.</div>`
        : MOODKEYS.map(k=>{ const v=c.mood?c.mood[k]:0; return `<div class="mrow" style="grid-template-columns:78px 1fr 42px">
          <span class="mkey">${k}</span><span class="track"><i style="width:${pctOf(k,v)}%;background:${moodColor(k,v)}"></i></span>
          <span class="mval">${Number(v).toFixed(2)}</span></div>`; }).join("")}
      </div>
    </div>
    <details style="margin-top:10px">
      <summary>Mood history · ${(c.moodHistory||[]).length>1?Math.round(((c.moodHistory||[]).slice(-1)[0].t-(c.moodHistory||[])[0].t)/3600000)+"h":"starts now"}</summary>
      ${sparkSVG(c.moodHistory||[], "v", "#ffb257", c.mood?c.mood.valence:null)}
    </details>

    <div class="moodline">
      <span class="moodname">${esc(c.moodLabel||"—")}</span>
      <span class="chip">${manual?"manual":"auto"}</span>
      <span class="grow"></span>
      ${c.tier==="stranger"?`<span class="chip warn">stranger</span>`:c.tier==="acquaintance"?`<span class="chip">acquaintance</span>`:""}
    </div>
    ${manual?moodEdit(c):""}
    ${manual?"":`<div class="btns"><button class="act" data-act="mood-auto" data-jid="${esc(c.jid)}">Auto (model)</button></div>`}

    ${conv?`<div class="conv">${conv}</div>`:""}
    ${c.routineTheme?`<div class="tiny" style="margin-top:9px">today: <b style="color:var(--tx)">${esc(c.routineTheme)}</b>${c.routineNow?` · now: ${esc(c.routineNow.what)}`:""}</div>`:""}
    ${(c.tasks||[]).length?`<div class="tiny" style="margin-top:6px">📤 ${c.tasks.map(t=>`→ <b>${esc(t.to)}</b> ${esc(t.text.slice(0,40))} <span class="tiny">(${esc(t.status)})</span>`).join(" · ")}</div>`:""}
    ${(c.crossNotes||[]).length?`<div class="tiny" style="margin-top:6px">🔗 ${c.crossNotes.map(n=>`${esc(n.from)}: ${esc(n.what.slice(0,70))}`).join(" · ")}</div>`:""}

const MEM_LISTS = [["facts","Facts"],["boundaries","Boundaries"],["plans","Plans & promises"],["jokes","Jokes"]];
async function renderMemory(){
  if(!CHAT_JID) return;
  const m = await api("/api/memory?jid="+encodeURIComponent(CHAT_JID));
  const box = $("#chat-memory");
  if(!m.ok){ box.innerHTML=""; return; }
  const pinnedKey = (l,t)=>`${l}::${t}`;
  const isPinned = (l,t)=> (m.pinned||[]).some(p=>pinnedKey(p.list,p.text)===pinnedKey(l,t));
  box.innerHTML = `
    <div class="card">
      <div class="row"><h2 style="margin:0">What she remembers</h2><span class="grow"></span>
        <button class="act" id="mem-sum-save">Save note</button></div>

      <div style="margin-top:9px"><label>Running summary (rewritten as you talk)</label>

      ${MEM_LISTS.map(([key,label])=>`
        <div style="margin-top:14px">
          <div class="row"><span class="kick">${esc(label)} (${(m[key]||[]).length})</span><span class="grow"></span>
            <button class="act" data-mem-clear="${key}" style="padding:4px 10px">Clear</button></div>
          ${(m[key]||[]).map((v,i)=>`<div class="mrow" style="grid-template-columns:1fr 30px 30px;gap:7px;align-items:center;margin-top:6px">
            <span style="font-size:12.5px">${esc(v)}</span>
            <button class="act" data-mem-pin="${key}" data-i="${i}" title="${isPinned(key,v)?"pinned — survives rewrites":"pin it"}"
              style="padding:3px 7px;${isPinned(key,v)?"border-color:var(--accent);color:var(--accent)":""}">${isPinned(key,v)?"★":"☆"}</button>
            <button class="act" data-mem-del="${key}" data-i="${i}" style="padding:3px 7px">✕</button>
          </div>`).join("") || '<div class="tiny" style="margin-top:5px">nothing yet</div>'}
          <div class="row" style="margin-top:7px">
            <input data-mem-add="${key}" placeholder="add to ${esc(label.toLowerCase())}…" style="flex:1">
            <button class="act" data-mem-addbtn="${key}">Add</button>
          </div>
        </div>`).join("")}

      ${(m.highlights||[]).length?`<div style="margin-top:14px"><span class="kick">Highlights (from her own days)</span>
        ${m.highlights.map(h=>`<div class="tiny" style="margin-top:4px">${KINDICON[h.kind]||"•"} ${esc(h.what)} <span class="tiny">· ${esc(h.date||"")}</span></div>`).join("")}</div>`:""}
      ${(m.tasks||[]).length?`<div style="margin-top:12px"><span class="kick">Errands</span>
        ${m.tasks.map(t=>`<div class="tiny" style="margin-top:4px">→ ${esc(t.to)}: ${esc(t.text.slice(0,60))} <span class="tiny">(${esc(t.status)})</span></div>`).join("")}</div>`:""}
    </div>`;
  box.dataset.loaded = "1";

  const act = async (payload)=>{ await api("/api/memory",{ jid:CHAT_JID, ...payload }); box.dataset.loaded=""; await renderMemory(); };
  box.onclick = async (e)=>{
    const del=e.target.closest("[data-mem-del]"), pin=e.target.closest("[data-mem-pin]"), clr=e.target.closest("[data-mem-clear]"), addb=e.target.closest("[data-mem-addbtn]");
    if(del) return act({ action:"delete", list:del.dataset.memDel, index:Number(del.dataset.i) });
    if(pin){
      const list=pin.dataset.memPin, i=Number(pin.dataset.i);
      const value=(m[list]||[])[i];
      return act({ action: isPinned(list,value)?"unpin":"pin", list, value });
    }
    if(clr){ if(!confirm("Clear this list?")) return; return act({ action:"clear", list:clr.dataset.memClear }); }
    if(addb){
      const input=box.querySelector(`[data-mem-add="${addb.dataset.memAddbtn}"]`);
      const value=(input.value||"").trim(); if(!value) return;
      return act({ action:"add", list:addb.dataset.memAddbtn, value });
    }
    if(e.target.id==="mem-sum-save"){
      await act({ action:"summary", value:$("#mem-sum").value });
      await act({ action:"relationship", value:$("#mem-rel").value });
      toast("Memory saved");
    }
  };
  box.onkeydown = (e)=>{ if(e.key==="Enter" && e.target.dataset.memAdd) e.target.nextElementSibling.click(); };
}

async function loadChatView(){
  if(!CHAT_JID) return;
  const r = await api(`/api/chat?jid=${encodeURIComponent(CHAT_JID)}&q=${encodeURIComponent(CHAT_Q)}&limit=400`);
  const view = $("#chat-view");
  if(!r.ok){ view.innerHTML = `<div class="card"><div class="empty">Could not load: ${esc(r.error||"")}</div></div>`; return; }
  const meta = $("#chat-meta");
  if(meta) meta.innerHTML = `${esc(r.contact.name||r.contact.number)} · ${r.total} messages stored${CHAT_Q?` · <b>${r.matched}</b> match “${esc(CHAT_Q)}”`:""}`;
  if(!r.messages.length){ view.innerHTML = `<div class="card"><div class="empty">Nothing here.</div></div>`; view.dataset.loaded="1"; return; }
  let lastDay = "";
  const parts = [];
  for(const m of r.messages){
    const d = new Date(m.ts||0);
    const day = d.toDateString();
    if(day !== lastDay){
      lastDay = day;
      parts.push(`<div class="chatday">${emptyDay(d)}</div>`);
    }
    const time = d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    const cls = m.role==="user" ? "them" : "her";
    const flags = `${m.deleted?'<span class="tiny"> · deleted by her</span>':""}${m.viaTask?'<span class="tiny"> · sent for you</span>':""}`;
    parts.push(`<div class="chatrow ${cls}"><div class="bub ${cls}">${esc(m.text)}<div class="tiny" style="margin-top:4px;opacity:.7">${time}${flags}</div></div></div>`);
  }
  view.innerHTML = `<div class="card tight chatwrap">${parts.join("")}</div>`;
  view.dataset.loaded = "1";
  view.querySelector(".chatwrap").scrollTop = view.querySelector(".chatwrap").scrollHeight;
}
function emptyDay(d){
  const today = new Date();
  const y = new Date(Date.now()-86400000);
  if(d.toDateString()===today.toDateString()) return "Today";
  if(d.toDateString()===y.toDateString()) return "Yesterday";
  return d.toLocaleDateString("id-ID",{weekday:"long", day:"numeric", month:"short", year:"numeric"});
}

  const rb=$("#btn-routine-new");
  if(rb) rb.onclick=async ()=>{
    if(charDirty && !confirm("You have unsaved card changes. Generate a new routine anyway?")) return;
    toast("Generating a new day…");
    const r=await api("/api/routine/new",{ slug:CHAR_SLUG });

/** Toggle yang tidak butuh handler besar: langsung menempel di tombolnya. */
window.uwFlip = (el) => el.classList.toggle("on");

window.uwSelfieToggle = async (el, key) => {
  el.classList.toggle("on");
  const on = el.classList.contains("on");
  const st = document.getElementById("sf-status");
  if (st) st.textContent = "menyimpan…";
  const r = await api("/api/photos", { action: "selfie-settings", values: { [key]: on } });
  if (st) st.textContent = r.ok ? (on ? "selfie terjadwal: AKTIF ✓" : "selfie terjadwal: mati") : "GAGAL: " + (r.error || "");
};

window.uwSelfieSave = async () => {
  const st = document.getElementById("sf-status");
  const values = {
    SELFIE_SCHEDULE: document.getElementById("sf-sched").value.trim(),
    SELFIE_MAX_PER_DAY: document.getElementById("sf-max").value,
  };
  const spot = document.getElementById("sf-spot").value.trim();
  const typed = document.getElementById("sf-outfit-text").value.trim();
  const saveWear = document.getElementById("sf-savewear").classList.contains("on");
  if (st) st.textContent = "menyimpan…";
  const r = await api("/api/photos", { action: "selfie-settings", values, spot });
  if (!r.ok) { if (st) st.textContent = "GAGAL: " + (r.error || ""); return; }
  let extra = "";
  if (typed && saveWear) {
    const w = await api("/api/photos", { action: "wardrobe-add", name: typed, times: [], styles: [] });
    extra = w.ok ? " · baju ditambahkan ke wardrobe" : "";
  }
  const read = await fetch("/api/photos", { cache: "no-store" }).then((x) => x.json()).catch(() => null);
  const now = read && read.selfie ? read.selfie : null;
  if (st) {
    st.textContent = now
      ? `tersimpan ✓ · aktif: ${now.enabled ? "ya" : "tidak"} · tempat: "${String(now.spot).slice(0, 40)}" · maks: ${now.maxPerDay}${extra}`
      : "tersimpan ✓";
  }
  PHOTO_PICK = { outfit: document.getElementById("sf-outfit").value, style: document.getElementById("sf-style").value, typed };
};

window.uwSelfieNow = async () => {
  const st = document.getElementById("sf-status");
  const typed = document.getElementById("sf-outfit-text").value.trim();
  const outfit = typed || document.getElementById("sf-outfit").value || "";
  const style = document.getElementById("sf-style").value || "casual";
  PHOTO_PICK = { outfit, style, typed };
  if (st) st.textContent = "bikin selfie… (10-20 detik)";
  const r = await api("/api/photos", { action: "selfie-now", outfit, style });
  if (st) st.textContent = r.ok ? `selfie jadi ✓ dikirim ke ${r.sent} kontak (${Math.round(r.seconds)}s)` : "GAGAL: " + (r.error || "");
};

/* switches: klik tombolnya, bukan checkbox */
$("#tab-photos").addEventListener("click", async (e)=>{
  const sw = e.target.closest(".switch");
  if(sw){
    const swk = sw.dataset.swk, contact = sw.dataset.contact, cat = sw.dataset.wcat, wd = sw.dataset.wd;
    sw.classList.toggle("on");
    const on = sw.classList.contains("on");
    if(swk){
      const values = {}; values[swk] = on;
      const r = await api("/api/photos",{ action:"settings", values });
      if(!r.ok) toast("Gagal: "+(r.error||""));
      return;
    }
    if(contact){
      await api("/api/photos",{ action:"contact", jid: contact, allowed: on });
      toast(on?"Boleh kirim foto ke dia":"Nggak akan kirim foto ke dia");
      return;
    }
    if(cat){
      const [id, kind, tag] = cat.split("|");
      const card = sw.closest("[data-w]");
      const picked = $$("#tab-photos [data-w=\""+id+"\"] .switch.on[data-wcat]").filter(x=>x.dataset.wcat.split("|")[1]===kind).map(x=>x.dataset.wcat.split("|")[2]);
      await api("/api/photos",{ action:"wardrobe-update", id, [kind]: picked });
      return;
    }
    if(wd){
      await api("/api/photos",{ action:"rate", id: wd, weird: on });
      toast(on?"Ditandai aneh":"Tanda aneh dihapus");
      return;
    }
  }

  const wsave = e.target.closest("[data-wsave]");
  if(wsave){
    const id = wsave.dataset.wsave;
    const card = wsave.closest("[data-w]");
    const name = card.querySelector('[data-wf="name"]').value;
    const description = card.querySelector('[data-wf="description"]').value;
    const r = await api("/api/photos",{ action:"wardrobe-update", id, name, description });
    toast(r.ok?"Baju disimpan":("Gagal: "+(r.error||"")));
    return refresh(true);
  }
  const wdel = e.target.closest("[data-wdel]");
  if(wdel){
    const r = await api("/api/photos",{ action:"wardrobe-remove", id: wdel.dataset.wdel });
    toast(r.ok?"Baju dihapus":("Gagal: "+(r.error||"")));
    return refresh(true);
  }
  const wimg = e.target.closest("[data-wimg]");
  if(wimg){
    const inp = document.querySelector('[data-wup="' + wimg.dataset.wimg + '"]');
    if(inp) inp.click(); else toast("input file-nya nggak ketemu");
    return;
  }

  
  const b = e.target.closest("[data-pact],[data-rate]"); if(!b) return;
  const act = b.dataset.pact, rate = b.dataset.rate;
  if(act==="save-settings"){
    const values = {};
    $$('#tab-photos [data-pk]').forEach(el=>{
      const k = el.dataset.pk;
      if(k==="PHOTO_CHANCE_PCT") values.PHOTO_CHANCE = String(Number(el.value)/100);
      else if(k==="PHOTO_GRAIN" && Number(el.value)===0) values[k] = "";
      else if(k==="PHOTO_BLOOM" && Number(el.value)<0) values[k] = "";
      else values[k] = el.value;
    });
    const r = await api("/api/photos",{ action:"settings", values });
    toast(r.ok?"Disimpan (langsung berlaku)":("Gagal: "+(r.error||"")));
    return refresh(true);
  }
      if(act==="wardrobe-add"){
    const name = $("#w-name").value.trim();
    if(!name) return toast("Nama bajunya belum diisi");
    const r = await api("/api/photos",{ action:"wardrobe-add", name, description: $("#w-desc").value.trim(), times: [], styles: [] });
    toast(r.ok?"Baju ditambahkan — atur kategorinya di card-nya":("Gagal: "+(r.error||"")));
    return refresh(true);
  }
  if(rate){
    const card = b.closest("[data-h]");
    const r = await api("/api/photos",{ action:"rate", id: card.dataset.h, rating: rate });
    toast(r.ok?"Dinilai":("Gagal: "+(r.error||"")));
    return refresh(true);
  }
});

$("#tab-photos").addEventListener("change", async (e)=>{
  const wup = e.target.closest("[data-wup]");
  if(wup && wup.files?.[0]){
    const file = wup.files[0];
    if(file.size > 6*1024*1024) return toast("Gambarnya kegedhean (maks 6MB)");
    const ext = (file.name.split(".").pop()||"jpg").toLowerCase();
    const data = await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(file);});
    toast("Mengunggah + membaca bajunya…");
    const r = await api("/api/photos",{ action:"wardrobe-image", id: wup.dataset.wup, data, ext });
    toast(r.ok ? (r.auto?.ok ? ("Deskripsi otomatis: " + String(r.auto.description).slice(0,60)) : "Gambar disimpan") : ("Gagal: "+(r.error||"")));
    return refresh(true);
  }
});

function drawAgent(){
  const log=$("#agent-log"); if(!log) return;
  if(!AGENT_LOG.length){ log.innerHTML=`<div class="card"><div class="empty">No conversation yet.<br>Pick an example above, or type your own.</div></div>`; return; }
  log.innerHTML=AGENT_LOG.map(m=>{
    if(m.role==="me") return `<div class="card tight" style="margin-left:auto;max-width:90%;background:linear-gradient(180deg,rgba(255,178,87,.24),rgba(255,178,87,.12));border-color:rgba(255,178,87,.35)">
      <div class="tiny">you</div><div>${esc(m.text)}</div></div>`;
    const chips=[...(m.applied||[]).map(a=>`<span class="chip ok">✓ ${esc(a.describe)}</span>`),
                 ...(m.refused||[]).map(r=>`<span class="chip" style="color:var(--bad)">✗ ${esc(r.reason)}</span>`)].join(" ");
    return `<div class="card tight" style="max-width:94%">
      <div class="tiny">agent${m.tookSec?` · ${m.tookSec}s`:""}</div>
      <div style="${m.pending?"color:var(--dim)":""}">${m.pending?`<span class="typing"><span></span><span></span><span></span></span> ${esc(m.say)}`:esc(m.say||"")}</div>
      ${chips?`<div class="row" style="margin-top:9px">${chips}</div>`:""}
      ${m.degraded?`<div class="tiny" style="margin-top:6px;color:var(--warn)">the model answered in prose — nothing was changed</div>`:""}
    </div>`;
  }).join("");
  log.lastElementChild?.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function sendAgent(){
  const inp=$("#agent-in"); const text=(inp.value||"").trim(); if(!text) return;
  inp.value="";
  AGENT_LOG.push({role:"me",text});
  const slot=AGENT_LOG.length;
  AGENT_LOG.push({role:"agent",say:"thinking",pending:true,startedAt:Date.now()});
  drawAgent();
  const history=AGENT_LOG.slice(0,-1).slice(-6).map(m=>({role:m.role,text:m.text||m.say}));
  let started;
  try{
    started=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:text,history})}).then(r=>r.json());
  }catch(err){ AGENT_LOG[slot]={role:"agent",say:"Could not reach the dashboard: "+err.message}; drawAgent(); return; }
  if(!started||!started.jobId){ AGENT_LOG[slot]={role:"agent",say:started&&started.error?("Failed: "+started.error):"The agent did not start."}; drawAgent(); return; }
  const t0=Date.now();
  const tick=setInterval(()=>{ AGENT_LOG[slot]={role:"agent",say:`thinking… ${Math.round((Date.now()-t0)/1000)}s`,pending:true,startedAt:t0}; drawAgent(); },1000);
  let r=null; const deadline=Date.now()+5*60*1000;
  while(Date.now()<deadline){
    await new Promise(res=>setTimeout(res,1200));
    try{ r=await api("/api/admin/job?id="+encodeURIComponent(started.jobId)); }catch{ continue; }
    if(r&&r.status&&r.status!=="running") break;
    r=null;
  }
  clearInterval(tick);
  if(!r){ AGENT_LOG[slot]={role:"agent",say:"Still running after five minutes. Try again, or check the Log tab."}; drawAgent(); return; }
  AGENT_LOG[slot]={role:"agent",say:r.status==="error"?("Failed: "+r.error):(r.say||"(empty reply)"),applied:r.applied,refused:r.refused,degraded:r.degraded,tookSec:Math.round((r.elapsedMs||0)/1000)};
  drawAgent();
  if((r.applied||[]).length){ SETTINGS_LOADED=false; DATA.personaCard=null; charDirty=false; const back=tab; await refresh(true); tab=back; }
}

    const el = $("#pause-state");
    if(el) el.innerHTML = pz.active
      ? `<span style="color:var(--warn)">⏸ paused now · ${pz.minutesLeft} min left</span>${pz.reason?` · ${esc(pz.reason)}`:""}`
      : "she is awake";
  };
  pauseState();
  const doPause = async (minutes, reason)=>{
    const r = await api("/api/pause",{ minutes, reason });
    if(!r.ok){ toast("Failed: "+(r.error||"")); return; }
    toast(`Paused for ${minutes} min${reason?` — ${reason}`:""}`);
    await refresh(true);
  };
  $$("#tab-settings [data-pause]").forEach(b=>{ b.onclick=()=>doPause(Number(b.dataset.pause), $("#pause-reason").value.trim()); });
  const pc=$("#btn-pause-custom"); if(pc) pc.onclick=()=>{ const m=Number($("#pause-min").value); if(!m) return toast("Give a number of minutes"); doPause(m, $("#pause-reason").value.trim()); };
  const br=$("#btn-resume"); if(br) br.onclick=async ()=>{
    const r=await api("/api/pause",{ resume:true });
    toast(r.wasAway?`She is back — and knows she was away: ${r.wasAway}`:"She is back");
    await refresh(true);
  };
  $("#feat-list").onclick=async (e)=>{
    const b=e.target.closest("[data-toggle]"); if(!b) return;
    const key=b.dataset.toggle;
    const on=!b.classList.contains("on");
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on?"true":"false");
    await api("/api/settings",{ values:{ [key]: on?1:0 } });
    toast(`${key} ${on?"on":"off"} — applied immediately`);
  };
  $("#knob-q").oninput=(e)=>{
    const q=e.target.value.trim().toLowerCase();
    $$(".kfield").forEach(f=>{ f.style.display=(!q||f.dataset.search.includes(q))?"":"none"; });
  };
  SETTINGS_LOADED=true;
}
async function saveSettings(){
  const values={};
  $$(".knob").forEach(i=>{ const v=i.value.trim(); values[i.dataset.k]=(v===""||isNaN(Number(v)))?v:Number(v); });
  await api("/api/settings",{values});
  SETTINGS_LOADED=false;
  toast("Saved — applied immediately, no restart needed");
  await refresh(true);
  const h=$("#save-hint"); if(h) h.innerHTML="✓ written to <b>.env</b> and picked up by the running bot.";
}

/* ═══════════════════════════════ usage ═══════════════════════════════ */
function evalPanel(e){
  if(!e) return "";
  const h = e.history || [];
  const spark = h.length>1 ? `<svg viewBox="0 0 300 60" preserveAspectRatio="none" style="width:100%;height:60px;margin-top:8px">
      ${(()=>{const pts=h.map((p,i)=>[6+(i*(288))/(h.length-1), 54-(Math.min(100,p.score)/100)*48]);
        const line=pts.map(([x,y],i)=>`${i?"L":"M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
        const area=`${line} L${pts[pts.length-1][0].toFixed(1)},54 L6,54 Z`;
        return `<path d="${area}" fill="color-mix(in srgb,var(--accent) 18%,transparent)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
          ${pts.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="var(--accent)"/>`).join("")}`;})()}
    </svg>` : "";
  const last = e.last;
  return `<div class="card">
    <div class="row"><h2 style="margin:0">Humanness check</h2><span class="grow"></span>
      ${e.running?'<span class="chip warn">running…</span>':(e.due?'<span class="chip accent">due</span>':'<span class="chip">weekly</span>')}
      <button class="act" id="btn-eval">Run now</button></div>
    <div class="hint" style="margin-top:6px">An independent judge reads an adversarial conversation and scores how detectable she is. Lower is better (0 = nobody would guess).</div>
    ${last?`<div class="row" style="margin-top:12px">
        <span style="font-size:26px;font-weight:650">${last.score}<span class="tiny">/100</span></span>
        <span class="chip ${last.score<=20?"ok":last.score<=45?"warn":""}">${esc(last.verdict)}</span>
        <span class="grow"></span><span class="tiny">${ago(last.at)} · ${esc(last.model||"")}</span>
      </div>
      ${h.length>1?`<div class="legend"><span>${e.runs} runs</span><span>best <b>${e.best}</b></span><span>worst <b>${e.worst}</b></span><span>avg <b>${e.average}</b></span></div>${spark}`:""}
      ${last.tells&&last.tells.length?`<details style="margin-top:8px"><summary>What the judge flagged last time</summary>
        <div style="margin-top:8px">${last.tells.map(t=>`<div class="tiny" style="margin-bottom:4px">• ${esc(t)}</div>`).join("")}</div></details>`:""}
      <div class="tiny" style="margin-top:8px">next automatic run in ${Math.max(0, e.everyDays - Math.floor((Date.now()-last.at)/86400000))} day(s)</div>`
      :`<div class="empty">No runs yet. Press Run now, or wait for the weekly check.</div>`}
  </div>`;
}

function renderQuota(){
  const q=DATA.quota, root=$("#tab-quota");
  const rows=Object.entries(q.usage||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.calls}</td><td>${v.in}</td><td>${v.out}</td></tr>`).join("");
  root.innerHTML=`
    <div class="card">
      <h2>Quota</h2>
      <div class="rings">
        ${ringSVG(q.photos,q.photoMax,q.photos+" / "+q.photoMax,"photos today","#ffc773")}
        ${ringSVG(q.ttsChars,q.ttsMax||0,q.ttsChars+"","voice characters","#b8dd8a")}
        ${q.eleven?ringSVG(q.eleven.left,q.eleven.limit||0,String(q.eleven.left),"ElevenLabs left","#ffb0c4"):""}
      </div>
      ${q.eleven&&q.eleven.reset?`<div class="tiny" style="text-align:center;margin-top:10px">ElevenLabs resets ${esc(q.eleven.reset)}</div>`:""}
    </div>
    ${evalPanel(DATA.evals)}
    <div class="card">
      <h2>Tokens ${q.usageDay?`· ${esc(q.usageDay)}`:""}</h2>
      <table><tr><th>provider</th><th>calls</th><th>in</th><th>out</th></tr>${rows||'<tr><td colspan=4 class="muted">none yet</td></tr>'}</table>
    </div>`;
}

/* ═══════════════════════════════ log ═══════════════════════════════ */
function renderLog(){
  const root=$("#tab-log");
  if(!$("#log-pre",root)) root.innerHTML=`<div class="card tight">
    <input id="log-q" placeholder="filter log…" autocomplete="off"><pre id="log-pre" style="margin-top:10px"></pre></div>`;
  const q=($("#log-q").value||"").trim().toLowerCase();
  const pre=$("#log-pre");
  const atBottom=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-24;
  pre.innerHTML=(DATA.log||[]).filter(l=>!q||l.toLowerCase().includes(q)).map(l=>{
    let c="#c3c9d8";
    if(/error|failed|✗/i.test(l)) c="#ff8a9a";
    else if(/→|sent|blocked/i.test(l)) c="#9fd8ff";
    else if(/←|received|stranger/i.test(l)) c="#b8f0c8";
    else if(/soft|thaw|dry|silent|moment/i.test(l)) c="#ffcf9e";
    return `<span style="color:${c}">${esc(l)}</span>`;
  }).join("\n");
  if(atBottom) pre.scrollTop=pre.scrollHeight;
}

/* ═══════════════════════════════ render ═══════════════════════════════ */
function renderAll(){
  renderHeader();
  if(tab==="contacts" && !dragging && !contactsDirty) renderContacts();
  if(tab==="chat") renderChat();
  if(tab==="status") renderStatus();
  try { if(tab==="photos") renderPhotos(); } catch (err) { const el=$("#tab-photos"); if(el) el.innerHTML = `<div class="card tight"><b style="color:var(--bad)">Photos tab error</b><pre style="white-space:pre-wrap;margin-top:8px">${String(err && err.message || err)}</pre></div>`; }
  if(tab==="character") renderCharacter();
  if(tab==="agent") renderAgent();
  if(tab==="schedule") renderSchedule();
  if(tab==="settings") renderSettings();
  if(tab==="quota") renderQuota();
  if(tab==="log") renderLog();
}
async function refresh(force){
  DATA=await api("/api/summary");
  if(force){ SETTINGS_LOADED=false; DATA.personaCard=null; charDirty=false; }
  renderAll();
}

/* ═══════════════════════════════ events ═══════════════════════════════ */
document.addEventListener("input",(e)=>{
  const t=e.target;
  if(t.closest&&t.closest("#tab-contacts")){
    contactsDirty=true;
    const h=$("#contacts-hint"); if(h) h.innerHTML='<span style="color:var(--warn)">● unsaved changes — press Save on that contact</span>';
  }
  if(t.closest&&t.closest("#tab-character")){
    charDirty=true;
    const h=$("#char-hint"); if(h) h.innerHTML='<span style="color:var(--warn)">● unsaved changes</span>';
  }
  if(t.classList?.contains("mrange")){
    dragging=true;
    const jid=t.dataset.jid;
    draft[jid]=draft[jid]||{values:{}};
    draft[jid].values[t.dataset.k]=Number(t.value);
    const out=t.closest(".mrow").querySelector(".mval"); if(out) out.textContent=Number(t.value).toFixed(2);
  }
  if(t.classList?.contains("knob")){ const h=$(`[data-h="${t.dataset.k}"]`); if(h) h.textContent=hintFor(t.dataset.k,t.value); }
  if(t.id==="q") renderContacts();
  if(t.id==="log-q") renderLog();
});
document.addEventListener("pointerup",()=>{ dragging=false; });
document.addEventListener("pointercancel",()=>{ dragging=false; });
document.addEventListener("toggle",(e)=>{
  const d=e.target.closest&&e.target.closest("#tab-contacts details"); if(!d) return;
  const jid=d.closest(".card")?.dataset.jid; if(!jid) return;
  if(d.open) openCards.add(jid); else openCards.delete(jid);
},true);

document.addEventListener("click",async (e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const jid=b.dataset.jid, act=b.dataset.act;
  if(act==="mood-manual"){
    const c=DATA.contacts.find(x=>x.jid===jid);
    draft[jid]={values:{...(c.mood||{})}};
    await api("/api/mood",{ jid, mood:c.mood, lock:true });
    toast("Manual mode — mood locked"); await refresh(true);
  }
  if(act==="mood-save"){
    const values=draft[jid]?.values||{};
    const r=await api("/api/mood",{ jid, mood:values, lock:true });
    delete draft[jid]; toast("Mood saved and locked → "+(r.label||"")); await refresh(true);
  }
  if(act==="mood-baseline"){
    const c=DATA.contacts.find(x=>x.jid===jid);
    draft[jid]={values:{...(c.baseline||c.mood||{})}}; renderContacts();
    toast("Values reset to normal — press Save to lock them");
  }
  if(act==="mood-auto"){
    toast("Assessing mood…");
    const r=await api("/api/mood/auto",{ jid, apply:true });
    delete draft[jid];
    toast(r.ok?("Auto → "+(r.label||"")+(r.suggested?.reason?" · "+r.suggested.reason:"")):("Failed: "+(r.error||"")));
    await refresh(true);
  }
  if(act==="trust"){
    contactsDirty=false;
    const want=b.dataset.v==="1";
    if(!want && !confirm("Revoke trust? She becomes cold again, and the pet name and mood reset to stranger mode.")) return;
    await api("/api/trust",{ jid, trusted:want });
    toast(want?"Trusted (full mode)":"Stranger mode"); await refresh(true);
  }
  if(act==="block"){
    contactsDirty=false;
    const want=b.dataset.v==="1";
    if(want && !confirm("Block this number on WhatsApp? They can no longer message this account.")) return;
    const r=await api("/api/block",{ jid, block:want });
    if(!r.ok) toast("Failed: "+(r.error||""));
    else if(want && r.onWhatsApp===false) toast('Ignored in the bot only — WhatsApp needs the real number. Fill in "Phone number" and retry.');
    else toast(want?"Blocked on WhatsApp":"Unblocked on WhatsApp");
    await refresh(true);
  }
  if(act==="save"){
    contactsDirty=false;
    const card=b.closest(".card");
    await api("/api/contact",{ jid, field:"nick", value:$(".f-nick",card).value });
    await api("/api/contact",{ jid, field:"persona", value:$(".f-persona",card).value });
    await api("/api/contact",{ jid, field:"phone", value:$(".f-phone",card).value });
    await api("/api/contact",{ jid, field:"relation", value:$(".f-relation",card).value, note:$(".f-relation-note",card).value });
    toast("Saved"); await refresh(true);
  }
  if(act==="proactive"){
    toast("Composing…");
    const r=await api("/api/proactive",{jid});
    toast(r.ok?("Sent: "+r.text):("Skipped: "+(r.reason||""))); refresh();
  }
  if(act==="reset"){
    if(!confirm("Reset this conversation? History and mood are cleared.")) return;
    await api("/api/contact/reset",{jid}); toast("Context reset"); refresh();
  }
});

$$("#tabs button").forEach(b=>{
  b.onclick=()=>{
    if(charDirty&&tab==="character"&&b.dataset.t!=="character"&&!confirm("You have unsaved card changes. Leave this tab?")) return;
    if(contactsDirty&&tab==="contacts"&&b.dataset.t!=="contacts"&&!confirm("You have unsaved contact changes. Leave this tab?")) return;
    $$("#tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); tab=b.dataset.t;
    $$("main > section").forEach(s=>s.hidden=true);
    $("#tab-"+tab).hidden=false;
    b.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
    renderAll();
  };
});
$("#btn-refresh").onclick=()=>refresh(true);
document.addEventListener("click", async (e)=>{
  if(!e.target.closest("#btn-eval")) return;
  const r = await api("/api/eval",{});
  toast(r.ok ? "Humanness check started — it takes a couple of minutes" : ("Failed: "+(r.error||"")));
  if(r.ok) setTimeout(()=>refresh(true), 8000);
});

/* appearance */
// installable + instant reload; the panel is local, so this is safe
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).then(r=>r.update()).catch(() => {});
  });
}
// deep links from the manifest shortcuts: /?tab=log
{
  const want = new URLSearchParams(location.search).get("tab");
  if (want) {
    const btn = document.querySelector(`#tabs button[data-t="${CSS.escape(want)}"]`);
    if (btn) btn.click();
  }
}

refresh();
setInterval(()=>{
  if(document.hidden) return;
  if(["settings","character","agent"].includes(tab)) return;
  if(tab==="contacts" && (contactsDirty||dragging)) return;
  refresh();
},8000);
setInterval(()=>{ if(tab==="contacts"&&!contactsDirty&&!dragging&&DATA) renderContacts(); }, 30000);
</script>
</body>
</html>
