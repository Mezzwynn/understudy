<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c10" />
<title>Understudy — Control Panel</title>
<style>
  :root{
    --bg:#0b0c10; --bg2:#0f1116; --card:#15171d; --card2:#1b1e26; --line:#262a34;
    --tx:#e9ebf1; --dim:#8b93a4; --dim2:#5f6675;
    --accent:#8b7bff; --accent2:#6f5cf0;
    --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b; --soft:#e3b6ff;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:32px; background-image:radial-gradient(900px 420px at 50% -180px,#1a1633 0%,transparent 70%)}
  a{color:var(--accent)}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.86);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .hwrap{max-width:940px;margin:0 auto;padding:12px 14px 0}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;
    box-shadow:0 0 0 0 rgba(61,220,151,.5)}
  .dot.on{background:var(--ok);animation:pulse 2.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.45)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  .muted{color:var(--dim);font-size:12px}
  .tiny{font-size:11px;color:var(--dim2)}
  nav{display:flex;gap:6px;margin:11px 0 0;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent;color:var(--dim);border:1px solid var(--line);
    padding:7px 13px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer;transition:.15s}
  nav button.active{background:var(--accent);color:#fff;border-color:transparent;font-weight:550}
  nav button:active{transform:scale(.96)}

  /* ---------- layout ---------- */
  main{padding:12px 14px 0;max-width:940px;margin:0 auto}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card.tight{padding:11px 12px}
  .card h2{font-size:13px;margin:0 0 11px;font-weight:600;letter-spacing:.3px;
    text-transform:uppercase;color:var(--dim)}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--card2);
    color:var(--dim);border:1px solid var(--line);white-space:nowrap}
  .badge.ok{color:#8ff0bb;border-color:#2b6647;background:#12241b}
  .badge.warn{color:#f0cd93;border-color:#6d5227;background:#241c0f}
  .badge.dry{color:var(--warn);border-color:#4a3a1c;background:#211a0e}
  .badge.silent{color:var(--bad);border-color:#4a2222;background:#210f0f}
  .badge.awaiting{color:#c8bcff;border-color:#3a3568;background:#191631}
  .badge.soft{color:var(--soft);border-color:#553f66;background:#1d1424}

  /* ---------- contact card ---------- */
  .ccard{position:relative}
  .avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    font-weight:650;font-size:15px;color:#fff;background:linear-gradient(140deg,var(--accent2),#3a3568);flex:none}
  .cname{font-size:15px;font-weight:600;margin:0;letter-spacing:-.2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}
  .stat{font-size:11px;color:var(--dim)}
  .stat b{color:var(--tx);font-weight:600}

  /* ---------- mood ---------- */
  .moodbox{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}
  .mhead{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .mlabel{font-size:13px;font-weight:600;color:#fff}
  .bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .mrow{display:grid;grid-template-columns:78px 1fr 40px;gap:9px;align-items:center;font-size:11px;margin-bottom:3px}
  .mkey{color:var(--dim);white-space:nowrap}
  .mval{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;border:0;margin:0;padding:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:var(--card2)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--accent);border:3px solid #0b0c10;margin-top:-8px;box-shadow:0 0 0 1px var(--accent)}
  input[type=range].v::-webkit-slider-thumb{background:var(--dim);box-shadow:0 0 0 1px var(--dim)}
  .locked{display:flex;align-items:center;gap:7px;background:#1d1424;border:1px solid #553f66;
    color:var(--soft);font-size:11px;padding:7px 10px;border-radius:9px;margin-bottom:9px}

  /* ---------- controls ---------- */
  button.act{background:var(--card2);color:var(--tx);border:1px solid var(--line);padding:8px 12px;
    border-radius:9px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
  button.act:active{transform:scale(.97)}
  button.act:hover{border-color:#39404f}
  button.act.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:550}
  button.act.primary:hover{background:var(--accent2)}
  button.act.ghost{background:transparent}
  button.act.danger{color:var(--bad);border-color:#3d2222}
  button.act[disabled]{opacity:.45;pointer-events:none}
  .btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  input,select,textarea{background:var(--card2);color:var(--tx);border:1px solid var(--line);
    border-radius:9px;padding:9px 10px;font-size:13px;width:100%;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px}
  .hint{font-size:10px;color:var(--dim2);margin-top:3px}
  details{border-top:1px solid var(--line);margin-top:11px;padding-top:9px}
  details summary{cursor:pointer;font-size:12px;color:var(--dim);list-style:none;
    display:flex;align-items:center;gap:6px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"›";transition:.2s;display:inline-block;font-size:15px;line-height:1}
  details[open] summary::before{transform:rotate(90deg)}

  /* ---------- tables / misc ---------- */
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:11px}
  tr:last-child td{border-bottom:0}
  pre{background:#0a0b0e;border:1px solid var(--line);border-radius:11px;padding:11px;
    font-size:11px;max-height:56vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
  .slots{display:flex;flex-wrap:wrap;gap:6px}
  .slot{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px}
  .slot.next{border-color:var(--accent);color:#fff;background:#1d1a38;font-weight:600}
  .slot.past{opacity:.35}
  .prog{height:7px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:6px}
  .prog i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .4s}
  .kwrap{border-bottom:1px solid var(--line);padding:9px 0}
  .kwrap:last-child{border-bottom:0}
  .kick{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px;font-weight:600}
  .toast{position:fixed;left:50%;transform:translate(-50%,14px);bottom:18px;background:var(--accent);
    color:#fff;padding:10px 17px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;
    pointer-events:none;z-index:50;max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 0}
  .fadein{animation:fi .28s ease}
  @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="row">
      <h1 id="pname">Understudy</h1>
      <span class="badge" id="pstate">—</span>
      <span class="grow"></span>
      <span class="muted"><span class="dot" id="dot"></span> <span id="num">—</span></span>
      <button class="act ghost" id="btn-refresh" title="Reload" style="padding:6px 10px">↻</button>
    </div>
    <div class="tiny" id="sub" style="margin-top:5px">loading…</div>
    <nav id="tabs">
      <button data-t="contacts" class="active">Contacts</button>
      <button data-t="character">Character</button>
      <button data-t="agent">Agent</button>
      <button data-t="settings">Settings</button>
      <button data-t="schedule">Schedule</button>
      <button data-t="quota">Usage</button>
      <button data-t="log">Log</button>
    </nav>
  </div>
</header>

<main>
  <section id="tab-contacts">
    <div class="card tight" id="ctools">
      <input id="q" placeholder="Search contacts (name or number)…" autocomplete="off">
    </div>
    <div id="clist"></div>
  </section>
  <section id="tab-character" hidden></section>
  <section id="tab-agent" hidden></section>
  <section id="tab-settings" hidden></section>
  <section id="tab-schedule" hidden></section>
  <section id="tab-quota" hidden></section>
  <section id="tab-log" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>
/* ============================ helpers ============================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MOODKEYS = ["valence","energy","arousal","affection","patience","playfulness"];
const MOODMIN = { valence:-1 };
let DATA=null, tab="contacts", SETTINGS_LOADED=false, CHAR_LOADED=false, CHAR_SLUG=null, charDirty=false;
const draft = {};       // jid -> values being edited
let dragging = false;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)} : {});
  return r.json().catch(()=>({}));
}
function ago(ts){
  if(!ts) return "—";
  const m = Math.round((Date.now()-ts)/60000);
  if(m<1) return "baru saja";
  if(m<60) return m+" menit lalu";
  const h=Math.round(m/60); if(h<24) return h+" jam lalu";
  return Math.round(h/24)+" hari lalu";
}
function pct(k,v){ return Math.max(0,Math.min(100, Math.round((k==="valence" ? (v+1)/2 : v)*100))); }
function hue(k,v){
  if(k==="valence") return v<0 ? "linear-gradient(90deg,#7a3b3b,#ff6b6b)" : "linear-gradient(90deg,#3b7a5a,#3ddc97)";
  if(k==="affection") return "linear-gradient(90deg,#6a4a7a,#e3b6ff)";
  if(k==="energy") return "linear-gradient(90deg,#4a4f6a,#8b9bff)";
  if(k==="patience") return v<0.4 ? "linear-gradient(90deg,#7a5b3b,#ffb454)" : "linear-gradient(90deg,#3b6a7a,#54d6ff)";
  if(k==="playfulness") return "linear-gradient(90deg,#7a6a3b,#ffe07a)";
  return "linear-gradient(90deg,#5a4a6a,#b0a0d0)";
}
function fmtMs(v){ const n=Number(v); if(!Number.isFinite(n)) return ""; return (n/1000).toFixed(n<1000?2:1)+"s"; }
function hintFor(k,v){
  const n = Number(v);
  if(!Number.isFinite(n)) return k==="DEFAULT_NICK" ? "empty = she calls you by your name / \"you\"" : "";
  if(/_MS$/.test(k)) return "≈ "+fmtMs(n);
  if(/_CHANCE$/.test(k) || /^NICK_(AFFECTION|VALENCE|PATIENCE)_MIN$/.test(k)) return Math.round(n*100)+"%";
  if(/_MIN$/.test(k) || /_AFTER$/.test(k)) return n+" menit";
  return "";
}

/* ============================ header ============================ */
function renderHeader(){
  const b = DATA.bot;
  $("#pname").textContent = `${b.persona.emoji||""} ${b.persona.name}`.trim();
  $("#dot").className = "dot" + (b.connected ? " on" : "");
  $("#num").textContent = b.number || "belum tersambung";
  $("#pstate").textContent = b.connected ? "online" : "terputus";
  $("#pstate").className = "badge " + (b.connected ? "ok" : "warn");
  const h=Math.floor(b.uptimeSec/3600), m=Math.floor(b.uptimeSec%3600/60);
  $("#sub").innerHTML = `up ${h}h ${m}m · messages first: idle &gt;${b.idleMin}m, gap ${b.gapMin}m · quiet hours ${b.quiet[0]}:00–${b.quiet[1]}:00`;
}

/* ============================ contacts ============================ */
function moodRead(c){
  const rows = MOODKEYS.map(k=>{
    const v = c.mood ? c.mood[k] : 0;
    return `<div class="mrow"><span class="mkey">${k}</span>
      <span class="bar"><i style="width:${pct(k,v)}%;background:${hue(k,v)}"></i></span>
      <span class="mval">${Number(v).toFixed(2)}</span></div>`;
  }).join("");
  return `<div class="moodbox">
    <div class="mhead">
      <span class="mlabel">${esc(c.moodLabel||"—")}</span>
      <span class="badge">auto</span>
      <span class="grow"></span>
      <span class="tiny">managed by the model from the chat</span>
    </div>
    ${rows}
    <div class="btns">
      <button class="act" data-act="mood-manual" data-jid="${esc(c.jid)}" >Manual</button>
      <button class="act" data-act="mood-auto" data-jid="${esc(c.jid)}" >Auto (model)</button>
    </div>
  </div>`;
}
function moodEdit(c){
  const d = draft[c.jid];
  const vals = d ? d.values : c.mood;
  const rows = MOODKEYS.map(k=>{
    const v = vals ? vals[k] : 0.5;
    const min = k==="valence" ? -1 : 0;
    return `<div class="mrow"><span class="mkey">${k}</span>
      <input type="range" class="mrange" data-k="${k}" data-jid="${esc(c.jid)}"
        min="${min}" max="1" step="0.05" value="${v}">
      <span class="mval" data-v="${k}">${Number(v).toFixed(2)}</span></div>`;
  }).join("");
  return `<div class="moodbox">
    <div class="mhead">
      <span class="mlabel">${esc(c.moodLabel||"—")}</span>
      <span class="badge soft">manual</span>
      <span class="grow"></span>
    </div>
    <div class="locked">🔒 <span>Mood locked${c.moodLockedAt?` ${ago(c.moodLockedAt)}`:""} — it will not change on its own until you press <b>Auto</b>.</span></div>
    ${rows}
    <div class="btns">
      <button class="act primary" data-act="mood-save" data-jid="${esc(c.jid)}" >Save</button>
      <button class="act" data-act="mood-baseline" data-jid="${esc(c.jid)}" >Reset to normal</button>
      <button class="act" data-act="mood-auto" data-jid="${esc(c.jid)}" >Auto (model)</button>
    </div>
  </div>`;
}
function routineBox(c){
  // the routine is global (one day per character) — this is only a summary,
  // panel lengkapnya ada di tab Karakter
  if(!c.routineTheme) return "";
  return `<div class="tiny" style="margin-top:8px">Hari ini: <b style="color:var(--tx)">${esc(c.routineTheme)}</b>${
    c.routineNow?` · now: ${esc(c.routineNow.what)}`:""}</div>`;
}
function contactCard(c){
  const badge = c.state==="dry"?"dry":c.state==="silent"?"silent":c.state==="awaiting"?"awaiting":"";
  const initial = (c.name||c.number||"?").trim().charAt(0).toUpperCase();
  const manual = c.moodMode === "manual";
  const commit = (c.commitments&&c.commitments.length)
    ? `<div class="tiny" style="margin-top:8px">Promise: ${c.commitments.map(x=>`“${esc(x.what)}” <span class="tiny">(${new Date(x.due).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})})</span>`).join(" · ")}</div>`
    : "";
  return `<div class="card ccard fadein">
    <div class="row">
      <span class="avatar">${esc(initial)}</span>
      <div class="grow" style="min-width:120px">
        <div class="row" style="gap:7px">
          <h2 class="cname" style="margin:0">${esc(c.name||c.number)}</h2>
          <span class="badge ${badge}">${c.state}${c.state==="dry"?` (${c.dryCount})`:""}</span>
          ${c.softMinutes?`<span class="badge soft">soft ${c.softMinutes}m</span>`:""}
        </div>
        <div class="tiny" style="margin-top:2px">${esc(c.number)}${c.nick?` · called “${esc(c.nick)}”`:""}</div>
      </div>
      <span class="badge ${c.trusted?'ok':c.tier==='acquaintance'?'':'warn'}">${c.blocked?'blocked':c.tier}</span>
    </div>
    <div class="stats">
      <span class="stat">in <b>${c.inbound}</b></span>
      <span class="stat">out <b>${c.outbound}</b></span>
      <span class="stat">last <b>${ago(c.lastInteraction)}</b></span>
      ${c.lastProactiveAt?`<span class="stat">started <b>${ago(c.lastProactiveAt)}</b></span>`:""}
    </div>
    ${manual ? moodEdit(c) : moodRead(c)}
    ${(c.tasks||[]).length?`<div class="tiny" style="margin-top:7px">📤 ${c.tasks.map(t=>`to <b>${esc(t.to)}</b>: ${esc(t.text.slice(0,50))} <span class="tiny">(${esc(t.status)})</span>`).join(" · ")}</div>`:""}
    ${(c.crossNotes||[]).length?`<div class="tiny" style="margin-top:7px">🔗 ${c.crossNotes.map(n=>`<b>${esc(n.from)}</b>: ${esc(n.what.slice(0,90))}`).join(" · ")}</div>`:""}
    ${(c.vouches||[]).length?`<div class="tiny" style="margin-top:4px;color:var(--warn)">⏳ waiting for ${c.vouches.map(v=>esc(v.with)).join(", ")} to answer</div>`:""}
    ${c.blocked?`<div class="locked" style="background:#241414;border-color:#5c2a2a;color:#ffb1b1">⛔ Blocked${c.blockReason?` — ${esc(c.blockReason)}`:""}</div>`:c.strikes?`<div class="tiny" style="margin-top:6px;color:var(--warn)">suspicion score ${c.strikes}</div>`:""}
    ${commit}
    ${routineBox(c)}
    <details>
      <summary>Contact settings</summary>
      <div class="grid" style="margin-top:10px">
        <div><label>Name you go by for her</label>
          <input class="f-nick" data-jid="${esc(c.jid)}" value="${esc(c.nick)}" placeholder="mis. sayang"></div>
        <div><label>Character (slug, optional)</label>
          <input class="f-persona" data-jid="${esc(c.jid)}" value="${esc(c.persona)}" placeholder="(default)"></div>
      </div>
      <div class="btns">
        <button class="act primary" data-act="save" data-jid="${esc(c.jid)}" >Save</button>
        <button class="act" data-act="trust" data-jid="${esc(c.jid)}" data-v="${c.trusted?0:1}">${c.trusted?'Revoke trusted':'Mark as trusted'}</button>
        <button class="act" data-act="proactive" data-jid="${esc(c.jid)}" >Message them now</button>
        <button class="act" data-act="block" data-jid="${esc(c.jid)}" data-v="${c.blocked?0:1}" ${c.trusted?'disabled':''}>${c.blocked?'Unblock':'Block number'}</button>
        <button class="act danger" data-act="reset" data-jid="${esc(c.jid)}" >Reset context</button>
      </div>
    </details>
  </div>`;
}
function renderContacts(){
  const root = $("#clist");
  const q = ($("#q").value||"").trim().toLowerCase();
  const list = DATA.contacts.filter(c => !q || (c.name||"").toLowerCase().includes(q) || (c.number||"").includes(q));
  root.innerHTML = list.length ? list.map(contactCard).join("")
    : `<div class="card"><div class="empty">${DATA.contacts.length?"No matches.":"No contacts yet."}</div></div>`;
}

/* ============================ character ============================ */
const CHAR_FIELDS = [
  ["name", "Name", "e.g. Fiona"],
  ["emoji", "Emoji", "🖤"],
  ["vibe", "Vibe (one line)", "Cold on the surface, caring but refuses to show it"],
  ["language", "Language", "English-dominant, casual, with a little Indonesian"],
  ["deflection", "Line she uses when accused of being an AI", "hm. whatever."],
  ["active_hours", "Active hours", "11-14,17-19,21-2"],
  ["work_hours", "Work hours", "13-21"],
  ["chat_schedule", "Message-first schedule", "11,16,20,23"],
  ["voice", "Voice (Gemini TTS)", "Kore"],
  ["voice_eleven", "ElevenLabs voice ID", ""],
  ["voice_tags", "Signature audio tags", "[sighs] [pause] [dryly]"],
  ["voice_style", "Voice style", ""],
  ["appearance", "Appearance (for photos)", ""],
];
const KINDICON = { fun:"😄", sweet:"🥰", proud:"😤", annoyed:"😒", sad:"😢", scared:"😨", tired:"😮‍💨", awkward:"😬" };

async function renderCharacter(force){
  const root = $("#tab-character");
  // do not redraw while the user is typing — it would wipe their input
  if(charDirty && !force && root.innerHTML.trim()) return;
  let card = DATA.personaCard;
  if(!card || force){
    const slug = CHAR_SLUG || DATA.bot.persona.slug;
    card = await api("/api/persona/card?slug="+encodeURIComponent(slug));
    if(!card.ok){ root.innerHTML = `<div class="card"><div class="empty">Gagal muat kartu characters.</div></div>`; return; }
    DATA.personaCard = card; CHAR_SLUG = slug;
  }
  const fm = card.frontmatter || {};
  root.innerHTML = `
    <div class="card">
      <div class="row"><h2 style="margin:0">Character</h2><span class="grow"></span>
        <select id="char-picker" style="max-width:150px">
          ${DATA.personas.map(p=>`<option value="${esc(p.slug)}" ${p.slug===CHAR_SLUG?"selected":""}>${esc((p.emoji||"")+" "+p.name)}</option>`).join("")}
        </select>
      </div>
      <div class="btns" style="margin-top:11px">
        <button class="act" id="btn-char-export">Export .json</button>
        <button class="act" id="btn-char-import">Import .json</button>
        <button class="act" id="btn-char-share">Share in chat</button>
        <span class="grow"></span>
        <button class="act danger" id="btn-char-delete">Delete</button>
        <input type="file" id="char-file" accept=".json,application/json" hidden>
      </div>
      <div class="grid" style="margin-top:12px">
        ${CHAR_FIELDS.map(([k,label,ph])=>`<div><label>${esc(label)}<span class="tiny"> · ${k}</span></label>
          <input class="cf" data-k="${k}" value="${esc(fm[k]||"")}" placeholder="${esc(ph)}"></div>`).join("")}
      </div>
      <div class="hint" style="margin-top:8px">Active hours = when she may appear online. Schedule = when she may message first (hour only = random minute each day).</div>
    </div>

    <div class="card">
      <h2>Personality (character card)</h2>
      <textarea id="char-body" rows="18" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6">${esc(card.body||"")}</textarea>
      <div class="hint" style="margin-top:6px">This is what makes her feel alive: vocabulary, texting habits, example lines, what she hides. The more specific, the better.</div>
      <div class="btns">
        <button class="act primary" id="btn-char-save" >Save character</button>
        <span class="grow"></span>
        <span class="muted" id="char-hint"></span>
      </div>
    </div>

    ${routinePanel(DATA.routine)}
  `;
  $("#char-picker").onchange = (e)=>{
    if(charDirty && !confirm("You have unsaved changes. Switch character?")){ e.target.value = CHAR_SLUG; return; }
    charDirty = false; CHAR_SLUG = e.target.value; DATA.personaCard=null; renderCharacter(true);
  };
  $("#btn-char-save").onclick = ()=>saveCharacter();
  $("#btn-char-export").onclick = ()=>{ window.location = "/api/persona/export?slug="+encodeURIComponent(CHAR_SLUG); };
  $("#btn-char-import").onclick = ()=>$("#char-file").click();
  $("#btn-char-share").onclick = async ()=>{
    const r = await api("/api/admin",{ message:`Export the character ${CHAR_SLUG} as a shareable file and tell me what is in it` });
    toast((r.say||"").slice(0,160));
    drawAgent && null;
  };
  $("#char-file").onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const text = await f.text();
    const applySettings = confirm("Also apply the behaviour settings inside this file?");
    const r = await api("/api/persona/import",{ bundle:text, applySettings });
    if(!r.ok){ toast("Import failed: "+(r.error||"")); return; }
    toast("Imported as \""+r.slug+"\""+(r.renamed?" (name was taken)":"")+(r.settingsApplied?" · "+r.settingsApplied+" settings applied":""));
    CHAR_SLUG = r.slug; DATA.personaCard = null; charDirty=false;
    await refresh(true);
  };
  $("#btn-char-delete").onclick = async ()=>{
    if(!confirm(`Delete "${CHAR_SLUG}"? It is moved to personas/.trash/ so you can restore it later.`)) return;
    const r = await api("/api/persona/delete",{ slug: CHAR_SLUG });
    if(!r.ok){ toast("Failed: "+(r.error||"")); return; }
    toast("Deleted"+ (r.switchedTo? " · now using "+r.switchedTo : ""));
    CHAR_SLUG = r.switchedTo || (DATA.personas[0]&&DATA.personas[0].slug) || null;
    DATA.personaCard = null; await refresh(true);
  };
  const rb = $("#btn-routine-new");
  if(rb) rb.onclick = async ()=>{
    if(charDirty && !confirm("You have unsaved card changes. Generate a new routine anyway? (unsaved edits may be lost)")) return;
    toast("Generating a new day…");
    const r = await api("/api/routine/new",{ slug: CHAR_SLUG });
    toast(r.ok ? ("New routine: "+r.routine.theme) : ("Failed: "+(r.error||"")));
    await refresh(true);
  };
}

async function saveCharacter(){
  const frontmatter = {};
  $$(".cf").forEach(i=>{ frontmatter[i.dataset.k] = i.value.trim(); });
  const body = $("#char-body").value;
  const r = await api("/api/persona/save",{ slug: CHAR_SLUG, frontmatter, body });
  if(!r.ok){ toast("gagal: "+(r.error||"")); return; }
  charDirty = false;
  toast("Character saved — applied immediately, no restart needed");
  await refresh(true);
  const h=$("#char-hint");
  if(h) h.textContent = "✓ saved · used from the next reply on";
}

let AGENT_LOG = [];
let AGENT_LOADED = false;
const AGENT_IDEAS = [
  "Make her reply less often, she answers too much right now",
  "Inject a routine for today: gym in the morning, client meeting at noon, a walk in the afternoon, cooking at night",
  "She gets cold too fast, make her a bit more patient",

function renderAgent(){
  const root = $("#tab-agent");
  if(!AGENT_LOADED){
    root.innerHTML = `
      <div class="card tight">
        <div class="row"><b style="font-size:12px">Configuration agent (OOC)</b><span class="grow"></span>
          <span class="badge warn">cannot touch the core system</span></div>
        <div class="tiny" style="margin-top:5px">It can change: behaviour settings · personality card · routine · schedule · active hours · active character · per-contact nickname.
        It <b>cannot</b>: edit code or files, delete data, change API keys, ALLOW or TRUSTED lists.</div>
      </div>
      <div class="card tight"><div class="slots" id="agent-ideas">
        ${AGENT_IDEAS.map(i=>`<span class="slot" data-idea="${esc(i)}" style="cursor:pointer;font-size:11px">${esc(i)}</span>`).join("")}
      </div></div>
      <div id="agent-log"></div>
      <div class="card tight" style="position:sticky;bottom:8px">
        <div class="row"><input id="agent-in" placeholder="What should I change?" autocomplete="off">
          <button class="act primary" id="agent-send">Send</button></div>
      </div>`;
    $("#agent-send").onclick = sendAgent;
    $("#agent-in").onkeydown = (e)=>{ if(e.key==="Enter") sendAgent(); };
    $("#agent-ideas").onclick = (e)=>{
      const i = e.target.closest("[data-idea]"); if(!i) return;
      $("#agent-in").value = i.dataset.idea; sendAgent();
    };
    AGENT_LOADED = true;
  }
  drawAgent();
}

function drawAgent(){
  const log = $("#agent-log");
  if(!log) return;
  if(!AGENT_LOG.length){
    log.innerHTML = `<div class="card"><div class="empty">No messages yet.<br>Pick one of the examples above, or type your own.</div></div>`;
    return;
  }
  log.innerHTML = AGENT_LOG.map(m=>{
    if(m.role==="me") return `<div class="card" style="margin-left:auto;max-width:88%;background:#241d3d;border-color:#4a3f7a">
        <div class="tiny">you</div><div>${esc(m.text)}</div></div>`;
    const chips = [
      ...(m.applied||[]).map(a=>`<span class="badge ok">✓ ${esc(a.describe)}</span>`),
      ...(m.refused||[]).map(r=>`<span class="badge silent">✗ ${esc(r.reason)}</span>`),
    ].join(" ");
    return `<div class="card" style="max-width:92%">
        <div class="tiny">agent</div>
        <div>${esc(m.say||"")}</div>
        ${chips?`<div class="row" style="margin-top:8px">${chips}</div>`:""}
        ${m.degraded?`<div class="tiny" style="margin-top:6px;color:var(--warn)">the model answered in prose — nothing was changed</div>`:""}
        ${m.tookSec?`<div class="tiny" style="margin-top:5px">took ${m.tookSec}s</div>`:""}
      </div>`;
  }).join("");
  log.lastElementChild?.scrollIntoView({behavior:"smooth", block:"nearest"});
}

async function sendAgent(){
  const inp = $("#agent-in");
  const text = (inp.value||"").trim();
  if(!text) return;
  inp.value = "";
  AGENT_LOG.push({ role:"me", text });
  const slot = AGENT_LOG.length;
  AGENT_LOG.push({ role:"agent", say:"thinking…", pending:true, startedAt:Date.now() });
  drawAgent();

  const history = AGENT_LOG.slice(0,-1).slice(-6).map(m=>({role:m.role, text:m.text||m.say}));

  // start the job, then poll: a long model call must never look like a timeout
  let started;
  try {
    started = await fetch("/api/admin",{
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ message:text, history }),
    }).then(r=>r.json());
  } catch (err){
    AGENT_LOG[slot] = { role:"agent", say:"Could not reach the dashboard: "+err.message };
    drawAgent(); return;
  }
  if(!started || !started.jobId){
    AGENT_LOG[slot] = { role:"agent", say: started && started.error ? "Failed: "+started.error : "The agent did not start." };
    drawAgent(); return;
  }

  const t0 = Date.now();
  const tick = setInterval(()=>{
    const el = Math.round((Date.now()-t0)/1000);
    AGENT_LOG[slot] = { role:"agent", say:`thinking… ${el}s`, pending:true, startedAt:t0 };
    drawAgent();
  }, 1000);

  let r = null;
  const deadline = Date.now() + 5*60*1000;
  while(Date.now() < deadline){
    await new Promise(res=>setTimeout(res,1200));
    try {
      r = await api("/api/admin/job?id="+encodeURIComponent(started.jobId));
    } catch { continue; }
    if(r && r.status && r.status !== "running") break;
    r = null;
  }
  clearInterval(tick);

  if(!r){
    AGENT_LOG[slot] = { role:"agent", say:"Still running after five minutes. The model may be stuck — try again, or check the Log tab." };
    drawAgent(); return;
  }
  const secs = Math.round((r.elapsedMs||0)/1000);
  AGENT_LOG[slot] = {
    role:"agent",
    say: r.status === "error" ? "Failed: "+r.error : (r.say || "(empty reply)"),
    applied: r.applied, refused: r.refused, tookSec: secs, degraded: r.degraded,
  };
  drawAgent();
  if((r.applied||[]).length){
    SETTINGS_LOADED = false; DATA.personaCard = null; charDirty = false;
    const back = tab; await refresh(true); tab = back;
  }
}

function knobField(k){
  const v = k.value ?? "";
  return `<div class="kfield" data-key="${esc(k.key)}" data-search="${esc((k.label+" "+k.key).toLowerCase())}">
    <label>${esc(k.label)}<span class="tiny"> · ${esc(k.key)}</span></label>
    <input data-k="${esc(k.key)}" class="knob" value="${esc(v)}">
    <div class="hint" data-h="${esc(k.key)}">${hintFor(k.key,v)}</div>
  </div>`;
}
function renderSettings(){
  if(SETTINGS_LOADED) return;
  const s = DATA.settings, root = $("#tab-settings");
  const seen = new Set();
  const groups = GROUPS.map(([title, keys])=>{
    const fields = keys.map(key=>{
      const k = s.knobs.find(x=>x.key===key); if(!k) return ""; seen.add(key); return knobField(k);
    }).join("");
    return fields ? `<div class="kwrap"><div class="kick">${esc(title)}</div><div class="grid">${fields}</div></div>` : "";
  }).join("");
  const rest = s.knobs.filter(k=>!seen.has(k.key)).map(knobField).join("");

  root.innerHTML = `
    <div class="card">
      <h2>Character</h2>
      <div class="grid">
        <div><label>Active character</label>
          <select id="set-persona">${DATA.personas.map(p=>`<option value="${esc(p.slug)}" ${p.slug===DATA.bot.persona.slug?"selected":""}>${esc((p.emoji||"")+" "+p.name)}</option>`).join("")}</select></div>
        <div><label>Active hours</label><input id="set-hours" value="${esc(s.activeHours)}" placeholder="11-14,17-19,21-2"></div>
        <div><label>Message-first schedule</label><input id="set-sched" value="${esc(s.chatSchedule)}" placeholder="11,12,13,17,18,19"></div>
      </div>
      <div class="hint" style="margin-top:8px">Schedule format: <b>hour only</b> = random minute each day (11,12,13) · <b>hour:minute</b> = fixed minute (12:30).</div>
    </div>
    <div class="card">
      <div class="row"><h2 style="margin:0">Behaviour</h2><span class="grow"></span>
        <input id="knob-q" placeholder="search settings…" style="max-width:190px"></div>
      <div style="margin-top:12px" id="knobbox">
        ${groups}${rest?`<div class="kwrap"><div class="kick">Other</div><div class="grid">${rest}</div></div>`:""}
      </div>
      <div class="btns" style="margin-top:14px">
        <button class="act primary" id="btn-save-settings" >Save (applies immediately)</button>
        <button class="act" id="btn-auto" >Auto (let the model decide)</button>
        <span class="grow"></span>
        <button class="act danger" id="btn-restart" >Restart bot</button>
      </div>
      <div class="muted" id="save-hint" style="margin-top:9px"></div>
    </div>`;
  $("#btn-save-settings").onclick = () => saveSettings();
  $("#btn-auto").onclick = async () => {
    toast("The model is deciding…");
    const r = await api("/api/auto",{apply:true});
    if(r.ok){ toast("Automatic settings applied"); SETTINGS_LOADED=false; await refresh(true); }
    else toast("Failed: "+(r.error||"?"));
  };
  $("#btn-restart").onclick = async () => { await api("/api/restart",{}); toast("Restarting…"); };
  $("#knob-q").oninput = (e)=>{
    const q = e.target.value.trim().toLowerCase();
    $$(".kfield").forEach(f=>{ f.style.display = (!q || f.dataset.search.includes(q)) ? "" : "none"; });
    $$(".kwrap").forEach(w=>{ w.style.display = $$(".kfield",w).some(f=>f.style.display!=="none") ? "" : "none"; });
  };
  SETTINGS_LOADED = true;
}
async function saveSettings(){
  const values = {};
  $$(".knob").forEach(i=>{
    const v=i.value.trim();
    values[i.dataset.k] = (v==="" || isNaN(Number(v))) ? v : Number(v);
  });
  const activeHours = $("#set-hours").value.trim();
  const chatSchedule = $("#set-sched").value.trim();
  const slug = $("#set-persona").value;
  if(slug !== DATA.bot.persona.slug) await api("/api/persona",{slug});
  await api("/api/settings",{values, activeHours, chatSchedule});
  SETTINGS_LOADED = false;
  toast("Saved — applied immediately, no restart needed");
  await refresh(true);
  const hint = $("#save-hint");
  if(hint) hint.innerHTML = "✓ written to <b>.env</b> and picked up by the running bot.";
}

/* ============================ log ============================ */
function renderLog(){
  const root=$("#tab-log");
  if(!$("#log-pre",root)) root.innerHTML = `<div class="card tight">
      <input id="log-q" placeholder="filter log…" autocomplete="off">
      <pre id="log-pre" style="margin-top:9px"></pre></div>`;
  const q = ($("#log-q").value||"").trim().toLowerCase();
  const pre = $("#log-pre");
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 24;
  const lines = (DATA.log||[]).filter(l=>!q || l.toLowerCase().includes(q));
  pre.innerHTML = lines.map(l=>{
    let cls = "";
    if(/error|failed|gagal|ERR/.test(l)) cls="#ff8a8a";
    else if(/→|sent|terkirim/.test(l)) cls="#9fd8ff";
    else if(/←|received|masuk/.test(l)) cls="#b8f0c8";
    else if(/soft|melunak|thaw|ngambek|dry|silent/.test(l)) cls="#e3b6ff";
    return `<span style="color:${cls||"#c9ced9"}">${esc(l)}</span>`;
  }).join("\n");
  if(atBottom) pre.scrollTop = pre.scrollHeight;
}

async function refresh(forceSettings){
  DATA = await api("/api/summary");
  if(forceSettings) { SETTINGS_LOADED = false; DATA.personaCard = null; }
  renderAll();
}

/* ============================ events ============================ */
document.addEventListener("input", (e)=>{
  const t = e.target;
  if(t.closest && t.closest("#tab-character")){
    charDirty = true;
    const h = $("#char-hint");
    if(h) h.innerHTML = '<span style="color:var(--warn)">● unsaved changes</span>';
  }
  if(t.classList?.contains("mrange")){
    dragging = true;
    const jid = t.dataset.jid;
    draft[jid] = draft[jid] || { values:{} };
    draft[jid].values[t.dataset.k] = Number(t.value);
    const out = t.closest(".mrow").querySelector(".mval");
    if(out) out.textContent = Number(t.value).toFixed(2);
  }
  if(t.classList?.contains("knob")){
    const h = $(`[data-h="${t.dataset.k}"]`);
    if(h) h.textContent = hintFor(t.dataset.k, t.value);
  }
  if(t.id === "q") renderContacts();
  if(t.id === "log-q") renderLog();
});
document.addEventListener("pointerup", ()=>{ dragging = false; });
document.addEventListener("pointercancel", ()=>{ dragging = false; });

document.addEventListener("click", async (e)=>{
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const jid = b.dataset.jid, act = b.dataset.act;

  if(act==="mood-manual"){
    const c = DATA.contacts.find(x=>x.jid===jid);
    draft[jid] = { values: { ...(c.mood||{}) } };
    await api("/api/mood",{ jid, mood: c.mood, lock: true });
    toast("Manual mode — mood locked");
    SETTINGS_LOADED = false; await refresh(true);
  }
  if(act==="mood-save"){
    const values = draft[jid]?.values || {};
    const r = await api("/api/mood",{ jid, mood: values, lock: true });
    delete draft[jid];
    toast("Mood saved and locked → "+(r.label||""));
    await refresh(true);
  }
  if(act==="mood-baseline"){
    const c = DATA.contacts.find(x=>x.jid===jid);
    draft[jid] = { values: { ...(c.baseline||c.mood||{}) } };
    renderContacts();
    toast("angka diresets ke normal — pencet Simpan buat mengunci");
  }
  if(act==="mood-auto"){
    toast("Assessing mood…");
    const r = await api("/api/mood/auto",{ jid, apply:true });
    delete draft[jid];
    toast(r.ok ? ("auto → "+(r.label||"")+(r.suggested?.reason?" · "+r.suggested.reason:"")) : ("gagal: "+(r.error||"")));
    await refresh(true);
  }
  if(act==="block"){
    const want = b.dataset.v === "1";
    if(want && !confirm("Block this number on WhatsApp? They will no longer be able to message this account.")) return;
    const r = await api("/api/block",{ jid, block: want });
    toast(r.ok ? (want?"Number blocked":"Number unblocked") : ("Failed: "+(r.error||"")));
    await refresh(true);
  }
  if(act==="trust"){
    const want = b.dataset.v === "1";
    if(!want && !confirm("Cabut kepercayaan? Dia bakal dingin lagi, panggilan sayang & mood-nya diresets ke mode asing.")) return;
    await api("/api/trust",{ jid, trusted: want });
    toast(want ? "Trusted (full mode)" : "Stranger mode");
    await refresh(true);
  }
  if(act==="save"){
    const card = b.closest(".card");
    await api("/api/contact",{ jid, field:"nick", value: $(".f-nick",card).value });
    await api("/api/contact",{ jid, field:"persona", value: $(".f-persona",card).value });
    toast("Saved"); refresh();
  }
  if(act==="proactive"){
    toast("Composing…");
    const r = await api("/api/proactive",{jid});
    toast(r.ok ? ("Sent: "+r.text) : ("Skipped: "+(r.reason||"")));
    refresh();
  }
  if(act==="reset"){
    if(!confirm("Reset this conversation? History and mood are cleared.")) return;
    await api("/api/contact/reset",{jid}); toast("Context reset"); refresh();
  }
});

$$("#tabs button").forEach(b=>{
  b.onclick = () => {
    $$("#tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    if(charDirty && tab==="character" && b.dataset.t!=="character" && !confirm("You have unsaved card changes. Leave this tab?")) return;
    tab = b.dataset.t;
    $$("main > section").forEach(s=>s.hidden=true);
    $("#tab-"+tab).hidden=false;
    renderAll();
  };
});
$("#btn-refresh").onclick = ()=>refresh(true);

refresh();
// never auto-refresh a tab that is being edited — this used to wipe
// whatever was being typed, every five seconds
setInterval(()=>{ if(tab!=="settings" && tab!=="character" && tab!=="agent") refresh(); }, 5000);
</script>
</body>
