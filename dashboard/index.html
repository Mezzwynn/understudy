<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#131109" />
<link rel="icon" href="/logo.png" />
<title>Understudy — Control Panel</title>
<style>
  /* ─────────────────────────────  design tokens  ───────────────────────────── */
  :root{
    /* one fixed palette: soft dark, warm orange & yellow */
    --bg:#131109;
    --bg-2:#1b1710;
    --panel:rgba(40,33,22,.74);
    --panel-2:rgba(52,43,29,.62);
    --card-2:rgba(30,25,17,.74);
    --line:rgba(255,206,150,.13);
    --line-2:rgba(255,206,150,.21);
    --tx:#faf1e2;
    --dim:#c6ae92;
    --dim-2:#a08b73;
    --accent:#ffb257;
    --accent-2:#e08a2a;
    --accent-glow:rgba(255,178,87,.35);
    --on-accent:#1d1408;
    --ok:#b8dd8a;
    --warn:#ffd166;
    --bad:#ff8f7a;
    --soft:#ffcf9e;
    --r-lg:20px; --r:14px; --r-sm:10px;
    --shadow:0 18px 50px -22px rgba(0,0,0,.92);
    --blur:blur(18px) saturate(135%);
    --pad:16px; --gap:18px; --fs:15px;
    --glow-1:rgba(255,152,58,.17); --glow-2:rgba(255,206,92,.08);
    --header-bg:rgba(19,17,9,.9); --header-bg2:rgba(19,17,9,.66);
    --input-bg:rgba(14,12,7,.72);
    --ghost:rgba(255,206,150,.06); --track:rgba(255,206,150,.13);
    --conv:rgba(10,9,5,.5); --bub-them:rgba(255,206,150,.07); --code-bg:rgba(9,8,4,.78);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-size:var(--fs);
    background:
      radial-gradient(1100px 600px at 50% -260px, var(--glow-1), transparent 62%),
      radial-gradient(700px 420px at 100% 10%, var(--glow-2), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg-2) 40%,var(--bg));
    background-attachment:fixed;
    color:var(--tx);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6;
    padding-bottom:64px;
    min-height:100vh;
  }
  a{color:var(--accent)}
  ::selection{background:var(--accent-glow)}
  /* thin scrollbars */
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}

  /* ─────────────────────────────  header  ───────────────────────────── */
  header{position:sticky;top:0;z-index:40;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    background:linear-gradient(180deg,var(--header-bg),var(--header-bg2));border-bottom:1px solid var(--line)}
  .hwrap{max-width:1080px;margin:0 auto;padding:14px 16px 0}
  .brandrow{display:flex;align-items:center;gap:12px}
  .logobox{position:relative;flex:none;width:50px;height:50px;border-radius:16px;overflow:hidden;
    border:1px solid var(--line-2);box-shadow:0 12px 30px -14px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.08);
    background:linear-gradient(150deg,var(--panel-2),var(--card-2));display:block}
  .logobox img{width:100%;height:100%;object-fit:cover;display:block}
  .logobox::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .namerow{display:flex;align-items:center;gap:8px;min-width:0}
  .ver{font-size:10.5px;font-weight:600;letter-spacing:.4px;color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);
    padding:2px 7px;border-radius:999px;flex:none}
  .brandtxt{min-width:0}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .subline{display:flex;align-items:center;gap:7px;margin-top:2px;flex-wrap:wrap}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--bad);position:relative;flex:none}
  .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;opacity:0}
  .pulse.on{background:var(--ok);color:var(--ok);animation:breathe 2.8s ease-in-out infinite}
  .pulse.on::after{animation:ring 2.8s ease-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}50%{box-shadow:0 0 14px 2px rgba(61,220,151,.25)}}
  @keyframes ring{0%{opacity:.55;transform:scale(.7)}70%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
  .chip{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);
    background:var(--panel-2);color:var(--dim);white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
  .chip b{color:var(--tx);font-weight:600}
  .chip.ok{color:#8ff0bb;border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
  .chip.warn{color:#f2cf9b;border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.08)}
  .chip.soft{color:var(--soft);border-color:rgba(227,182,255,.35);background:rgba(227,182,255,.08)}
  .chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

  body.t-mono .bub.her{color:var(--tx)}

  @media (max-width:430px){
    #chip-up{display:none}
    .namerow h1{font-size:17.5px}
    .logobox{width:44px;height:44px;border-radius:14px}
  }

  /* tabs */
  nav{display:flex;gap:3px;margin:12px 0 0;overflow-x:auto;padding-bottom:11px;scrollbar-width:none;position:relative;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
  nav::-webkit-scrollbar{display:none}
  nav button{position:relative;background:transparent;color:var(--dim);border:1px solid transparent;
    padding:8px 11px;border-radius:11px;font-size:12.5px;font-family:inherit;white-space:nowrap;cursor:pointer;transition:.18s;flex:none}
  nav button:hover{color:var(--tx);background:var(--ghost)}
  nav button.active{color:var(--tx);background:color-mix(in srgb, var(--accent) 22%, transparent);
    border-color:color-mix(in srgb, var(--accent) 45%, transparent);box-shadow:0 8px 26px -14px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.12)}
  nav button .dot{position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--warn)}

  /* ─────────────────────────────  layout  ───────────────────────────── */
  main{padding:16px;max-width:1080px;margin:0 auto}
  section{animation:fade .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{position:relative;background:linear-gradient(180deg,var(--panel),var(--card-2));
    border:1px solid var(--line-2);border-radius:var(--r-lg);padding:var(--pad);margin-bottom:var(--gap);
    box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,var(--accent),transparent);opacity:.55}
  .card[data-tone="bad"]::before{background:linear-gradient(180deg,var(--bad),transparent)}
  .card[data-tone="warn"]::before{background:linear-gradient(180deg,var(--warn),transparent)}
  .card[data-tone="soft"]::before{background:linear-gradient(180deg,var(--soft),transparent)}
  .card.tight::before{top:10px;bottom:10px}
  .card.tight{padding:12px 14px}
  @media (max-width:520px){ .card{padding:14px;border-radius:17px} .card.hero{padding:15px} }
  .card.hero{padding:calc(var(--pad) + 2px)}
  h2{font-size:11.5px;margin:0 0 12px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .muted{color:var(--dim);font-size:12px}
  .tiny{font-size:11.5px;color:var(--dim-2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
  .stat{font-size:12px;color:var(--dim)}
  .stat b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 0}
  .kick{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:650}

  /* ─────────────────────────────  controls  ───────────────────────────── */
  button.act{background:var(--panel-2);color:var(--tx);border:1px solid var(--line-2);padding:10px 14px;min-height:40px;
    border-radius:11px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.16s}
  button.act:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);transform:translateY(-1px)}
  button.act:active{transform:translateY(0) scale(.985)}
  button.act.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);font-weight:600;
    box-shadow:0 10px 26px -14px var(--accent-glow)}
  button.act.primary:hover{filter:brightness(1.08)}
  button.act.ghost{background:transparent}
  button.act.danger{color:var(--bad);border-color:rgba(255,107,125,.35)}
  button.act[disabled]{opacity:.4;pointer-events:none}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  input,select,textarea{background:var(--input-bg);color:var(--tx);border:1px solid var(--line-2);
    border-radius:11px;padding:10px 12px;font-size:13px;font-family:inherit;width:100%;transition:.16s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
  label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.2px}
  .hint{font-size:11.5px;color:var(--dim-2);margin-top:5px;line-height:1.55}
  details{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
  details summary{cursor:pointer;font-size:12.5px;color:var(--dim);list-style:none;display:flex;align-items:center;gap:8px;transition:.16s}
  details summary:hover{color:var(--tx)}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"›";font-size:17px;line-height:1;transition:.2s;display:inline-block;color:var(--dim-2)}
  details[open] summary::before{transform:rotate(90deg);color:var(--accent)}

  /* ─────────────────────────────  person card  ───────────────────────────── */
  .person{display:flex;gap:13px;align-items:flex-start}
  .pavatar{width:54px;height:54px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:20px;font-weight:700;
    background:linear-gradient(155deg,var(--accent),var(--accent-2));color:var(--on-accent);
    box-shadow:0 14px 34px -16px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.2)}
  .pname{font-size:17px;font-weight:660;letter-spacing:-.3px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .visuals{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-top:14px}
  .radar{filter:drop-shadow(0 8px 26px rgba(0,0,0,.5))}
  .spark{width:100%;height:84px;display:block;margin-top:6px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .legend span{font-size:11.5px;color:var(--dim-2);display:inline-flex;align-items:center;gap:5px}
  .swatch{width:9px;height:9px;border-radius:3px;display:inline-block}
  .moodline{display:flex;align-items:center;gap:9px;margin-top:13px}
  .moodname{font-size:15px;font-weight:640}
  .mbars{display:flex;flex-direction:column;gap:5px;margin-top:11px}
  .mrow{display:grid;grid-template-columns:78px 1fr 44px;gap:9px;align-items:center;font-size:12px}
  .mkey{color:var(--dim)}
  .mval{text-align:right;font-variant-numeric:tabular-nums}
  .track{height:7px;border-radius:5px;background:var(--track);overflow:hidden;position:relative}
  .track i{position:absolute;inset:0 auto 0 0;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;height:26px;width:100%}
  input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:5px;background:var(--track)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-8px;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));border:3px solid #12100a;box-shadow:0 0 0 1px var(--accent),0 6px 16px -6px var(--accent-glow)}

  /* conversation preview */
  .conv{background:var(--conv);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:13px}
  .bub{max-width:88%;padding:9px 13px;border-radius:15px;font-size:13px;line-height:1.45;margin-bottom:7px;white-space:pre-wrap;word-break:break-word}
  .bub.them{background:var(--bub-them);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bub.her{background:color-mix(in srgb, var(--accent) 22%, transparent);border:1px solid color-mix(in srgb, var(--accent) 38%, transparent);
    margin-left:auto;border-bottom-right-radius:5px}

  /* ─────────────────────────────  timeline (schedule)  ───────────────────────────── */
  .timeline{position:relative;height:66px;margin-top:6px}
  .tl-track{position:absolute;inset:22px 0 auto;height:22px;border-radius:8px;background:var(--ghost);overflow:hidden;border:1px solid var(--line)}
  .tl-zone{position:absolute;top:0;bottom:0;opacity:.5}
  .tl-slot{position:absolute;top:14px;width:3px;height:38px;border-radius:3px;background:linear-gradient(180deg,var(--accent),transparent)}
  .tl-now{position:absolute;top:8px;width:2px;height:50px;background:var(--ok);box-shadow:0 0 12px 2px rgba(61,220,151,.6)}
  .tl-lbl{position:absolute;top:0;font-size:9.5px;color:var(--dim-2);transform:translateX(-50%)}
  .tl-ticks{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;font-size:9px;color:var(--dim-2)}

  /* ─────────────────────────────  rings (usage)  ───────────────────────────── */
  .rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;justify-items:center}
  .ring{text-align:center}
  .ring .cap{font-size:11px;color:var(--dim);margin-top:6px}
  .ring .big{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}

  /* ─────────────────────────────  table / log / toast  ───────────────────────────── */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:550;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
  tr:last-child td{border-bottom:0}
  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);padding:13px;font-size:11px;
    max-height:58vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}
  .slots{display:flex;flex-wrap:wrap;gap:6px}
  .slot{background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:6px 11px;font-size:12px}
  .slot.next{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--tx);font-weight:600}
  .slot.past{opacity:.32}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:linear-gradient(180deg,var(--accent),var(--accent-2));
    color:var(--on-accent);padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.26s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;z-index:60;max-width:90vw;text-align:center;box-shadow:0 18px 40px -18px rgba(0,0,0,.9)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .castcard{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--ghost)}
  .castav{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;
    background:var(--ghost);border:1px solid var(--line-2)}
  .typing span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brandrow">
      <a class="logobox" href="/" title="Understudy">
        <img src="/logo.png" alt="Understudy" />
      </a>
      <div class="brandtxt grow">
        <div class="namerow">
          <h1 id="pname">Understudy</h1>
          <span class="ver" id="chip-ver">v—</span>
        </div>
        <div class="subline">
          <span class="pulse" id="dot"></span>
          <span class="tiny" id="num">—</span>
          <span class="chip" id="pstate">—</span>
          <span class="chip" id="chip-up">—</span>
          <span class="chip accent" id="chip-next">—</span>
        </div>
      </div>
      <button class="act ghost" id="btn-refresh" title="Reload" style="padding:9px 12px">↻</button>
    </div>
    <nav id="tabs">
      <button data-t="contacts" class="active">Contacts</button>
      <button data-t="character">Character</button>
      <button data-t="agent">Agent</button>
      <button data-t="schedule">Schedule</button>
      <button data-t="settings">Settings</button>
      <button data-t="quota">Usage</button>
      <button data-t="log">Log</button>
    </nav>
  </div>
</header>

<main>
  <section id="tab-contacts">
    <div class="card tight" id="ctools">
      <input id="q" placeholder="Search contacts…" autocomplete="off">
      <div class="tiny" id="contacts-hint" style="margin-top:6px">auto-refresh pauses while you edit</div>
    </div>
    <div id="clist"></div>
  </section>
  <section id="tab-character" hidden></section>
  <section id="tab-agent" hidden></section>
  <section id="tab-schedule" hidden></section>
  <section id="tab-settings" hidden></section>
  <section id="tab-quota" hidden></section>
  <section id="tab-log" hidden></section>
</main>
<div class="toast" id="toast"></div>
<div id="errbanner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:#3a1d12;border-top:1px solid #7a3a22;color:#ffd7bd;padding:10px 14px;font-size:12px">
  <b>Dashboard error</b> <span id="errmsg"></span>
  <button class="act" style="margin-left:8px;padding:4px 10px" onclick="location.reload()">Reload</button>
</div>

<script>
/* ═══════════════════════════════ helpers ═══════════════════════════════ */
// surface any runtime error instead of leaving a half-dead page behind
function showError(msg){
  const b = document.getElementById("errbanner");
  const m = document.getElementById("errmsg");
  if(b && m){ m.textContent = String(msg).slice(0, 180); b.style.display = "block"; }
}
window.addEventListener("error", (e)=>showError(e.message));
window.addEventListener("unhandledrejection", (e)=>showError((e.reason && e.reason.message) || e.reason));

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MOODKEYS = ["valence","energy","arousal","affection","patience","playfulness"];
const MOODCOLOR = { valence:"#cfe08a", energy:"#ffc773", arousal:"#ff9a6b", affection:"#ffb0c4", patience:"#a8dcd0", playfulness:"#ffe08a" };
let DATA=null, tab="contacts", SETTINGS_LOADED=false, CHAR_SLUG=null, charDirty=false;
let contactsDirty=false, dragging=false, AGENT_LOG=[], AGENT_LOADED=false;
const draft={}, openCards=new Set();

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)} : {});
  return r.json().catch(()=>({}));
}
function ago(ts){
  if(!ts) return "—";
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1) return "just now";
  if(m<60) return m+"m ago";
  const h=Math.round(m/60); if(h<24) return h+"h ago";
  return Math.round(h/24)+"d ago";
}
const pctOf = (k,v) => Math.max(0,Math.min(100, Math.round((k==="valence"?(v+1)/2:v)*100)));
function moodColor(k,v){
  if(k==="valence") return v<0 ? "linear-gradient(90deg,#7a4436,#ff8f7a)" : "linear-gradient(90deg,#6a6a2f,#cfe08a)";
  return `linear-gradient(90deg,${MOODCOLOR[k]}55,${MOODCOLOR[k]})`;
}
const fmtMs = (v) => { const n=Number(v); return Number.isFinite(n) ? (n/1000).toFixed(n<1000?2:1)+"s" : ""; };
function hintFor(k,v){
  const n=Number(v);
  if(!Number.isFinite(n)) return k==="DEFAULT_NICK" ? "empty = she uses “you”" : "";
  if(/_MS$/.test(k)) return "≈ "+fmtMs(n);
  if(/_CHANCE$/.test(k) || /^NICK_MOOD_MIN$/.test(k)) return Math.round(n*100)+"%";
  if(/_MIN$/.test(k) || /_AFTER$/.test(k)) return n+" min";
  return "";
}

/* ═══════════════════════════════ svg visuals ═══════════════════════════════ */
function radarSVG(mood, size=118){
  const cx=size/2, cy=size/2, R=size/2-19, N=MOODKEYS.length;
  const pt=(i,r)=>{ const a=(-Math.PI/2)+(i*2*Math.PI/N); return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  let rings="";
  for(const f of [.25,.5,.75,1]){
    const p=MOODKEYS.map((_,i)=>pt(i,R*f).join(",")).join(" ");
    rings+=`<polygon points="${p}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
  }
  let spokes="";
  MOODKEYS.forEach((k,i)=>{
    const [x,y]=pt(i,R);
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.06)"/>`;
  });
  const vals=MOODKEYS.map((k,i)=>{ const v=mood?mood[k]:0; const n=k==="valence"?(v+1)/2:v; return pt(i,Math.max(.06,n)*R).join(","); }).join(" ");
  return `<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="mood radar">
    <defs><radialGradient id="mg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffb257" stop-opacity=".5"/><stop offset="100%" stop-color="#ff9a3c" stop-opacity=".12"/>
    </radialGradient></defs>
    ${rings}${spokes}
    <polygon points="${vals}" fill="url(#mg)" stroke="#ffb257" stroke-width="1.6"/>
    ${MOODKEYS.map((k,i)=>{ const v=mood?mood[k]:0; const n=k==="valence"?(v+1)/2:v; const [x,y]=pt(i,Math.max(.06,n)*R);
      return `<circle cx="${x}" cy="${y}" r="2.6" fill="${MOODCOLOR[k]}"/>`; }).join("")}
  </svg>`;
}
function sparkSVG(hist, key="v", color="#ffb257", fallback=null){
  let pts=(hist||[]).filter(h=>Number.isFinite(h[key]));
  // no history yet: draw a flat line from the current value so the panel is not empty
  if(pts.length<2 && fallback!==null && Number.isFinite(fallback)){
    const now=Date.now();
    pts=[{t:now-3600000,[key]:fallback},{t:now,[key]:fallback}];
  }
  if(pts.length<2) return `<svg class="spark" viewBox="0 0 300 76"><text x="150" y="42" font-size="11" fill="#8b93a8" text-anchor="middle">no history yet — it builds as she chats</text></svg>`;
  const norm = key==="v" ? (x=>(x+1)/2) : (x=>x);
  const W=300,H=76,pad=6;
  const xs=(i)=>pad+(i*(W-pad*2))/(pts.length-1);
  const ys=(x)=>H-pad-(norm(x)*(H-pad*2));
  const path=pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(p[key]).toFixed(1)}`).join(" ");
  const area=`${path} L${xs(pts.length-1).toFixed(1)},${H-pad} L${pad},${H-pad} Z`;
  const id="sg"+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".42"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${xs(pts.length-1)}" cy="${ys(pts[pts.length-1][key])}" r="3" fill="${color}"/>
  </svg>`;
}
function ringSVG(value, max, label, cap, color="#ffb257"){
  const size=92, r=36, c=2*Math.PI*r, f=max>0?Math.max(0,Math.min(1,value/max)):0;
  return `<div class="ring">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="8"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"
        style="filter:drop-shadow(0 0 8px ${color}66)"/>
      <text x="${size/2}" y="${size/2-1}" text-anchor="middle" font-size="16" font-weight="650" fill="#eceef5">${label}</text>
      <text x="${size/2}" y="${size/2+14}" text-anchor="middle" font-size="9" fill="#5b6376">${max>0?Math.round(f*100)+"%":"—"}</text>
    </svg>
    <div class="cap">${esc(cap)}</div>
  </div>`;
}
function dayTimeline(info){
  const sleep=[DATA.bot.quiet[0], DATA.bot.quiet[1]];
  const inRange=(h,a,b)=> a<=b ? (h>=a&&h<b) : (h>=a||h<b);
  const zones=[...Array(24).keys()].map(h=>{
    const sleeping=inRange(h,sleep[0],sleep[1]);
    let active=false;
    for(const part of String(info.activeHours||"").split(",")){
      const m=part.trim().match(/^(\d{1,2})-(\d{1,2})$/); if(!m) continue;
      if(inRange(h, Number(m[1]), Number(m[2]))) active=true;
    }
    if(sleeping) return null;
    return {h, color: active ? "rgba(255,178,87,.5)" : "rgba(255,255,255,.045)"};
  }).filter(Boolean);
  const pos=(h,m=0)=>((h*60+m)/1440)*100;
  const slots=(info.slots||[]).map(s=>`<div class="tl-slot" style="left:${pos(s.hour, s.minute||0)}%"></div>`).join("");
  const now=new Date(), nowPct=pos(now.getHours(), now.getMinutes());
  return `<div class="timeline">
    <div class="tl-lbl" style="left:${nowPct}%">now</div>
    ${zones.map(z=>`<div class="tl-zone" style="left:${z.h*4.1666}%;width:4.1666%;background:${z.color}"></div>`).join("")}
    <div class="tl-track">${zones.map(z=>`<div class="tl-zone" style="left:${(z.h/24)*100}%;width:${(1/24)*100}%;background:${z.color}"></div>`).join("")}</div>
    ${slots}
    <div class="tl-now" style="left:${nowPct}%"></div>
    <div class="tl-ticks">${[0,6,12,18,24].map(h=>`<span>${String(h%24).padStart(2,"0")}</span>`).join("")}</div>
  </div>`;
}

const AGENT_IDEAS = [
  "Make her reply less often, she answers too much right now",

  "She gets cold too fast, make her a bit more patient",

function renderAgent(){
  const root=$("#tab-agent");
  if(!AGENT_LOADED){

          <span class="chip warn">cannot touch the core system</span></div>
        <div class="hint" style="margin-top:6px">It can change: behaviour settings · personality card · backstory &amp; cast · routine · schedule · relationships · active character.
        It <b>cannot</b>: edit code or files, delete data, change API keys, ALLOW or TRUSTED lists.</div>
      </div>
      <div class="card tight"><div class="slots" id="agent-ideas">
        ${AGENT_IDEAS.map(i=>`<span class="slot" data-idea="${esc(i)}" style="cursor:pointer;font-size:11px">${esc(i)}</span>`).join("")}
      </div></div>
      <div id="agent-log"></div>

        <div class="row"><input id="agent-in" placeholder="What should I change?" autocomplete="off">
          <button class="act primary" id="agent-send">Send</button></div>
      </div>`;
    $("#agent-send").onclick=sendAgent;
    $("#agent-in").onkeydown=(e)=>{ if(e.key==="Enter") sendAgent(); };
    $("#agent-ideas").onclick=(e)=>{ const i=e.target.closest("[data-idea]"); if(!i) return; $("#agent-in").value=i.dataset.idea; sendAgent(); };
    AGENT_LOADED=true;
  }
  drawAgent();
}
function drawAgent(){
  const log=$("#agent-log"); if(!log) return;
  if(!AGENT_LOG.length){ log.innerHTML=`<div class="card"><div class="empty">No conversation yet.<br>Pick an example above, or type your own.</div></div>`; return; }
  log.innerHTML=AGENT_LOG.map(m=>{
    if(m.role==="me") return `<div class="card tight" style="margin-left:auto;max-width:90%;background:linear-gradient(180deg,rgba(255,178,87,.24),rgba(255,178,87,.12));border-color:rgba(255,178,87,.35)">
      <div class="tiny">you</div><div>${esc(m.text)}</div></div>`;
    const chips=[...(m.applied||[]).map(a=>`<span class="chip ok">✓ ${esc(a.describe)}</span>`),
                 ...(m.refused||[]).map(r=>`<span class="chip" style="color:var(--bad)">✗ ${esc(r.reason)}</span>`)].join(" ");
    return `<div class="card tight" style="max-width:94%">
      <div class="tiny">agent${m.tookSec?` · ${m.tookSec}s`:""}</div>
      <div style="${m.pending?"color:var(--dim)":""}">${m.pending?`<span class="typing"><span></span><span></span><span></span></span> ${esc(m.say)}`:esc(m.say||"")}</div>
      ${chips?`<div class="row" style="margin-top:9px">${chips}</div>`:""}
      ${m.degraded?`<div class="tiny" style="margin-top:6px;color:var(--warn)">the model answered in prose — nothing was changed</div>`:""}
    </div>`;
  }).join("");
  log.lastElementChild?.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function sendAgent(){
  const inp=$("#agent-in"); const text=(inp.value||"").trim(); if(!text) return;
  inp.value="";
  AGENT_LOG.push({role:"me",text});
  const slot=AGENT_LOG.length;
  AGENT_LOG.push({role:"agent",say:"thinking",pending:true,startedAt:Date.now()});
  drawAgent();
  const history=AGENT_LOG.slice(0,-1).slice(-6).map(m=>({role:m.role,text:m.text||m.say}));
  let started;
  try{
    started=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:text,history})}).then(r=>r.json());
  }catch(err){ AGENT_LOG[slot]={role:"agent",say:"Could not reach the dashboard: "+err.message}; drawAgent(); return; }
  if(!started||!started.jobId){ AGENT_LOG[slot]={role:"agent",say:started&&started.error?("Failed: "+started.error):"The agent did not start."}; drawAgent(); return; }
  const t0=Date.now();
  const tick=setInterval(()=>{ AGENT_LOG[slot]={role:"agent",say:`thinking… ${Math.round((Date.now()-t0)/1000)}s`,pending:true,startedAt:t0}; drawAgent(); },1000);
  let r=null; const deadline=Date.now()+5*60*1000;
  while(Date.now()<deadline){
    await new Promise(res=>setTimeout(res,1200));
    try{ r=await api("/api/admin/job?id="+encodeURIComponent(started.jobId)); }catch{ continue; }
    if(r&&r.status&&r.status!=="running") break;
    r=null;
  }
  clearInterval(tick);
  if(!r){ AGENT_LOG[slot]={role:"agent",say:"Still running after five minutes. Try again, or check the Log tab."}; drawAgent(); return; }
  AGENT_LOG[slot]={role:"agent",say:r.status==="error"?("Failed: "+r.error):(r.say||"(empty reply)"),applied:r.applied,refused:r.refused,degraded:r.degraded,tookSec:Math.round((r.elapsedMs||0)/1000)};
  drawAgent();
  if((r.applied||[]).length){ SETTINGS_LOADED=false; DATA.personaCard=null; charDirty=false; const back=tab; await refresh(true); tab=back; }
}

      <div class="rings">
        ${ringSVG(q.photos,q.photoMax,q.photos+" / "+q.photoMax,"photos today","#ffc773")}
        ${ringSVG(q.ttsChars,q.ttsMax||0,q.ttsChars+"","voice characters","#b8dd8a")}
        ${q.eleven?ringSVG(q.eleven.left,q.eleven.limit||0,String(q.eleven.left),"ElevenLabs left","#ffb0c4"):""}
      </div>
      ${q.eleven&&q.eleven.reset?`<div class="tiny" style="text-align:center;margin-top:10px">ElevenLabs resets ${esc(q.eleven.reset)}</div>`:""}
    </div>
    <div class="card">
      <h2>Tokens ${q.usageDay?`· ${esc(q.usageDay)}`:""}</h2>
      <table><tr><th>provider</th><th>calls</th><th>in</th><th>out</th></tr>${rows||'<tr><td colspan=4 class="muted">none yet</td></tr>'}</table>
    </div>`;
}

/* ═══════════════════════════════ log ═══════════════════════════════ */
function renderLog(){
  const root=$("#tab-log");
  if(!$("#log-pre",root)) root.innerHTML=`<div class="card tight">
    <input id="log-q" placeholder="filter log…" autocomplete="off"><pre id="log-pre" style="margin-top:10px"></pre></div>`;
  const q=($("#log-q").value||"").trim().toLowerCase();
  const pre=$("#log-pre");
  const atBottom=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-24;
  pre.innerHTML=(DATA.log||[]).filter(l=>!q||l.toLowerCase().includes(q)).map(l=>{
    let c="#c3c9d8";
    if(/error|failed|✗/i.test(l)) c="#ff8a9a";
    else if(/→|sent|blocked/i.test(l)) c="#9fd8ff";
    else if(/←|received|stranger/i.test(l)) c="#b8f0c8";
    else if(/soft|thaw|dry|silent|moment/i.test(l)) c="#ffcf9e";
    return `<span style="color:${c}">${esc(l)}</span>`;
  }).join("\n");
  if(atBottom) pre.scrollTop=pre.scrollHeight;
}

/* ═══════════════════════════════ render ═══════════════════════════════ */
function renderAll(){
  renderHeader();
  if(tab==="contacts" && !dragging && !contactsDirty) renderContacts();
  if(tab==="character") renderCharacter();
  if(tab==="agent") renderAgent();
  if(tab==="schedule") renderSchedule();
  if(tab==="settings") renderSettings();
  if(tab==="quota") renderQuota();
  if(tab==="log") renderLog();
}
async function refresh(force){
  DATA=await api("/api/summary");
  if(force){ SETTINGS_LOADED=false; DATA.personaCard=null; charDirty=false; }
  renderAll();
}

/* ═══════════════════════════════ events ═══════════════════════════════ */
document.addEventListener("input",(e)=>{
  const t=e.target;
  if(t.closest&&t.closest("#tab-contacts")){
    contactsDirty=true;
    const h=$("#contacts-hint"); if(h) h.innerHTML='<span style="color:var(--warn)">● unsaved changes — press Save on that contact</span>';
  }
  if(t.closest&&t.closest("#tab-character")){
    charDirty=true;
    const h=$("#char-hint"); if(h) h.innerHTML='<span style="color:var(--warn)">● unsaved changes</span>';
  }
  if(t.classList?.contains("mrange")){
    dragging=true;
    const jid=t.dataset.jid;
    draft[jid]=draft[jid]||{values:{}};
    draft[jid].values[t.dataset.k]=Number(t.value);
    const out=t.closest(".mrow").querySelector(".mval"); if(out) out.textContent=Number(t.value).toFixed(2);
  }
  if(t.classList?.contains("knob")){ const h=$(`[data-h="${t.dataset.k}"]`); if(h) h.textContent=hintFor(t.dataset.k,t.value); }
  if(t.id==="q") renderContacts();
  if(t.id==="log-q") renderLog();
});
document.addEventListener("pointerup",()=>{ dragging=false; });
document.addEventListener("pointercancel",()=>{ dragging=false; });
document.addEventListener("toggle",(e)=>{
  const d=e.target.closest&&e.target.closest("#tab-contacts details"); if(!d) return;
  const jid=d.closest(".card")?.dataset.jid; if(!jid) return;
  if(d.open) openCards.add(jid); else openCards.delete(jid);
},true);

document.addEventListener("click",async (e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const jid=b.dataset.jid, act=b.dataset.act;
  if(act==="mood-manual"){
    const c=DATA.contacts.find(x=>x.jid===jid);
    draft[jid]={values:{...(c.mood||{})}};
    await api("/api/mood",{ jid, mood:c.mood, lock:true });
    toast("Manual mode — mood locked"); await refresh(true);
  }
  if(act==="mood-save"){
    const values=draft[jid]?.values||{};
    const r=await api("/api/mood",{ jid, mood:values, lock:true });
    delete draft[jid]; toast("Mood saved and locked → "+(r.label||"")); await refresh(true);
  }
  if(act==="mood-baseline"){
    const c=DATA.contacts.find(x=>x.jid===jid);
    draft[jid]={values:{...(c.baseline||c.mood||{})}}; renderContacts();
    toast("Values reset to normal — press Save to lock them");
  }
  if(act==="mood-auto"){
    toast("Assessing mood…");
    const r=await api("/api/mood/auto",{ jid, apply:true });
    delete draft[jid];
    toast(r.ok?("Auto → "+(r.label||"")+(r.suggested?.reason?" · "+r.suggested.reason:"")):("Failed: "+(r.error||"")));
    await refresh(true);
  }
  if(act==="trust"){
    contactsDirty=false;
    const want=b.dataset.v==="1";
    if(!want && !confirm("Revoke trust? She becomes cold again, and the pet name and mood reset to stranger mode.")) return;
    await api("/api/trust",{ jid, trusted:want });
    toast(want?"Trusted (full mode)":"Stranger mode"); await refresh(true);
  }
  if(act==="block"){
    contactsDirty=false;
    const want=b.dataset.v==="1";
    if(want && !confirm("Block this number on WhatsApp? They can no longer message this account.")) return;
    const r=await api("/api/block",{ jid, block:want });
    if(!r.ok) toast("Failed: "+(r.error||""));
    else if(want && r.onWhatsApp===false) toast('Ignored in the bot only — WhatsApp needs the real number. Fill in "Phone number" and retry.');
    else toast(want?"Blocked on WhatsApp":"Unblocked on WhatsApp");
    await refresh(true);
  }
  if(act==="save"){
    contactsDirty=false;
    const card=b.closest(".card");
    await api("/api/contact",{ jid, field:"nick", value:$(".f-nick",card).value });
    await api("/api/contact",{ jid, field:"persona", value:$(".f-persona",card).value });
    await api("/api/contact",{ jid, field:"phone", value:$(".f-phone",card).value });
    await api("/api/contact",{ jid, field:"relation", value:$(".f-relation",card).value, note:$(".f-relation-note",card).value });
    toast("Saved"); await refresh(true);
  }
  if(act==="proactive"){
    toast("Composing…");
    const r=await api("/api/proactive",{jid});
    toast(r.ok?("Sent: "+r.text):("Skipped: "+(r.reason||""))); refresh();
  }
  if(act==="reset"){
    if(!confirm("Reset this conversation? History and mood are cleared.")) return;
    await api("/api/contact/reset",{jid}); toast("Context reset"); refresh();
  }
});

$$("#tabs button").forEach(b=>{
  b.onclick=()=>{
    if(charDirty&&tab==="character"&&b.dataset.t!=="character"&&!confirm("You have unsaved card changes. Leave this tab?")) return;
    if(contactsDirty&&tab==="contacts"&&b.dataset.t!=="contacts"&&!confirm("You have unsaved contact changes. Leave this tab?")) return;
    $$("#tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); tab=b.dataset.t;
    $$("main > section").forEach(s=>s.hidden=true);
    $("#tab-"+tab).hidden=false;
    b.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
    renderAll();
  };
});
$("#btn-refresh").onclick=()=>refresh(true);

/* appearance */
refresh();
setInterval(()=>{
  if(document.hidden) return;
  if(["settings","character","agent"].includes(tab)) return;
  if(tab==="contacts" && (contactsDirty||dragging)) return;
  refresh();
},8000);
setInterval(()=>{ if(tab==="contacts"&&!contactsDirty&&!dragging&&DATA) renderContacts(); }, 30000);
</script>
</body>
</html>
