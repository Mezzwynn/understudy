<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nilai foto — Understudy</title>
<style>
  :root{--bg:#131109;--bg2:#1c1810;--line:#33291c;--tx:#f3e6d2;--dim:#b39a78;--accent:#ffb257;--good:#4caf72;--bad:#e06a6a;--warn:#e0b64a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:14px 14px 90px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 14px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
  .card img{width:100%;display:block;background:#000;max-height:62vh;object-fit:contain}
  .body{padding:12px 14px 14px}
  .name{font-weight:700;font-size:13px;word-break:break-all;margin-bottom:8px}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .stat{background:#241e14;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--dim)}
  .stat b{color:var(--tx);font-weight:600}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{flex:1;min-width:104px;padding:12px 10px;border-radius:11px;border:1px solid var(--line);background:#241e14;color:var(--tx);font:600 14px system-ui;cursor:pointer}
  button.sel.good{background:#1f4d2b;border-color:var(--good);color:#c9f5d6}
  button.sel.bad{background:#4d1a1a;border-color:var(--bad);color:#ffc9c9}
  button.sel.warn{background:#4d3f14;border-color:var(--warn);color:#ffe6ab}
  input.note{width:100%;margin-top:9px;background:#241e14;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 10px;font-size:13px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#1a150d;border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
  .prog{flex:1;height:8px;background:#2c2419;border-radius:5px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .done{color:var(--good)}
  .refbox{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px;position:sticky;top:0;z-index:5}
  .refbox img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:0 0 auto}
  .grp{margin:22px 0 10px;font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<h1>Foto mana yang paling bagus</h1>
<p class="sub">Nilainya <b>bagus atau tidak menurut matamu</b> — bukan soal AI atau bukan. Kalau ada yang kelihatan aneh, centang kotaknya. Ini yang jadi patokan buat milih model.</p>
<div id="ref" style="display:none">
  <div class="refbox">
    <img id="refimg" alt="wajah acuan">
    <div><b>Wajah acuan (avatar Fio)</b><br>
      <span style="color:var(--dim);font-size:13px">Bandingkan dengan foto selfie: <b>orangnya sama atau bukan?</b> Itu pertanyaan utamanya.</span></div>
  </div>
</div>
<div id="list"></div>
<div class="bar">
  <span id="count">…</span>
  <span class="prog"><i id="prog" style="width:0%"></i></span>
  <span id="saved"></span>
</div>
<script>
const CUR = {};
let PHOTOS = [], RATINGS = {};

function statChips(s){
  if(!s) return "";
  return `<div class="stats">
    <span class="stat">kontras <b>${s.contrast}</b></span>
    <span class="stat">saturasi <b>${s.saturation}%</b></span>
    <span class="stat">warna <b>${s.colorfulness}</b></span>
    <span class="stat">tajam <b>${s.sharpness}</b></span>
    <span class="stat">noise <b>${s.noise}</b></span>
    <span class="stat">${s.mp} MP</span>
  </div>`;
}

function render(){
  const done = PHOTOS.filter(p => RATINGS[p.file]).length;
  document.getElementById("count").textContent = `${done}/${PHOTOS.length} dinilai`;
  document.getElementById("prog").style.width = (PHOTOS.length ? (done/PHOTOS.length*100) : 0) + "%";
  let grp = "";
  document.getElementById("list").innerHTML = PHOTOS.map(p => {
    const head = p.group && p.group !== grp ? (grp = p.group, `<div class="grp">${p.group}</div>`) : "";
    const r = RATINGS[p.file] || {};
    const c = (v) => r.verdict === v ? " sel " + ({bagus:"good",lumayan:"warn",kurang:"bad"}[v]) : "";
    return head + `<div class="card">
      <img src="${p.url}" loading="lazy" alt="">
      <div class="body">
        <div class="name">${p.file}</div>
        ${statChips(p.stats)}
        <div class="btns">
          <button class="vt${c("bagus")}" data-f="${p.file}" data-v="bagus">Paling bagus</button>
          <button class="vt${c("lumayan")}" data-f="${p.file}" data-v="lumayan">Lumayan</button>
          <button class="vt${c("kurang")}" data-f="${p.file}" data-v="kurang">Kurang</button>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:9px;font-size:13px;color:var(--dim)">
          <input type="checkbox" class="ai" data-f="${p.file}" ${r.ai?"checked":""}> kelihatan aneh / AI
        </label>
        <input class="note" data-f="${p.file}" placeholder="kenapa? (opsional)" value="${(r.note||"").replace(/"/g,"&quot;")}">
      </div></div>`;
  }).join("");
}

async function save(file, verdict, note, ai){
  const stats = PHOTOS.find(p => p.file === file)?.stats || null;
  const res = await fetch("/api/rate", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ file, verdict, note, ai, stats }) });
  if(res.ok){ RATINGS[file] = { file, verdict, note, ai }; document.getElementById("saved").innerHTML = '<span class="done">tersimpan ✓</span>'; setTimeout(()=>{document.getElementById("saved").textContent="";},1500); }
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest(".vt"); if(!b) return;
  const f = b.dataset.f, v = b.dataset.v;
  const note = document.querySelector(`.note[data-f="${CSS.escape(f)}"]`)?.value || "";
  const ai = document.querySelector(`.ai[data-f="${CSS.escape(f)}"]`)?.checked || false;
  CUR[f] = v; RATINGS[f] = { file:f, verdict:v, note, ai };
  b.closest(".btns").querySelectorAll(".vt").forEach(x => x.classList.remove("sel","good","bad","warn"));
  b.classList.add("sel", {bagus:"good",lumayan:"warn",kurang:"bad"}[v]);
  const done = PHOTOS.filter(p => RATINGS[p.file]).length;
  document.getElementById("count").textContent = `${done}/${PHOTOS.length} dinilai`;
  document.getElementById("prog").style.width = (done/PHOTOS.length*100) + "%";
  await save(f, v, note, ai);
});

document.addEventListener("change", async (e) => {
  const box = e.target.closest(".ai"); if(!box) return;
  const f = box.dataset.f;
  if(RATINGS[f]?.verdict) await save(f, RATINGS[f].verdict, RATINGS[f].note || "", box.checked);
});

document.addEventListener("change", async (e) => {
  const i = e.target.closest(".note"); if(!i) return;
  const f = i.dataset.f, v = RATINGS[f]?.verdict || CUR[f];
  if(v) await save(f, v, i.value, RATINGS[f]?.ai || false);
});

(async () => {
  const [list, rated] = await Promise.all([fetch("/api/ratelist").then(r=>r.json()), fetch("/api/rate").then(r=>r.json())]);
  PHOTOS = list.photos || [];
  if(list.avatar){ document.getElementById("ref").style.display="block"; document.getElementById("refimg").src=list.avatar; }
  for(const r of (rated.ratings||[])) RATINGS[r.file] = r;
  render();
})();
</script>
</body>
</html>
